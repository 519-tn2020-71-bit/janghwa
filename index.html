<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>철산의 귀 — 장화홍련전</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Song+Myung&display=swap">
<style>
:root{
  color-scheme:dark;
  --ink:#1b1a17; --ink2:#3a2f22; --paper:#f1ead8; --paper2:#e5dac0; --line:#b9a987;
  --text:#2a241c; --muted:#6b5f4c; --seal:#b3362b; --indigo:#2b4a6f; --gold:#c9a24f;
  --display:"Song Myung","Nanum Myeongjo","Batang",serif;
  --body:"Gowun Batang","Nanum Myeongjo","Batang",serif;
  --ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--text)}
body{font-family:var(--body);-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#cv{position:fixed;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges}

/* HUD */
.hud{position:fixed;left:0;right:0;top:0;display:flex;gap:8px;align-items:flex-start;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0;pointer-events:none;z-index:5}
.quest{pointer-events:auto;background:rgba(241,234,216,.94);border:2px solid var(--ink2);box-shadow:0 3px 0 rgba(0,0,0,.35);padding:7px 12px;max-width:min(520px,62vw);font-family:var(--ui);font-size:13px;line-height:1.45}
.quest .ch{font-family:var(--display);font-size:16px;color:var(--seal);display:block}
.quest .obj::before{content:"▸ ";color:var(--indigo)}
.hbtns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;pointer-events:auto}
.hb{background:rgba(241,234,216,.94);border:2px solid var(--ink2);box-shadow:0 3px 0 rgba(0,0,0,.35);padding:6px 10px;font-family:var(--ui);font-size:13px;white-space:nowrap}
.hb:hover{background:var(--paper)}
.hb .n{color:var(--seal);font-variant-numeric:tabular-nums;margin-left:3px}
.money{font-family:var(--ui);font-size:13px;background:rgba(241,234,216,.94);border:2px solid var(--ink2);padding:6px 10px;color:#7a5a12;font-variant-numeric:tabular-nums}

/* 대화 */
.dlg{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(780px,calc(100% - 24px));background:var(--paper);border:3px solid var(--ink2);box-shadow:0 0 0 2px var(--paper) inset,0 0 0 3px var(--line) inset,0 5px 0 rgba(0,0,0,.4);padding:16px 20px 14px;z-index:20;cursor:pointer}
.dlg .nm{display:flex;align-items:center;gap:10px;margin-bottom:6px;min-height:26px}
.dlg .nm b{font-family:var(--display);font-weight:400;font-size:20px}
.dlg .nm .think{font-family:var(--ui);font-size:12px;color:var(--muted)}
.dlg .orig{margin-left:auto;display:inline-grid;place-items:center;width:30px;height:30px;border:2px solid var(--seal);color:var(--seal);font-family:var(--display);font-size:15px;transform:rotate(-6deg);flex:none}
.dlg .tx{font-size:17.5px;line-height:1.85;min-height:3.7em;white-space:pre-wrap}
.dlg .tx.narr{color:#3d3428}
.dlg .more{position:absolute;right:16px;bottom:8px;font-size:12px;color:var(--muted);font-family:var(--ui);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.chs{display:grid;gap:6px;margin-top:10px}
.chs button{text-align:left;background:var(--paper2);border:2px solid var(--line);padding:8px 12px;font-size:16px;line-height:1.5}
.chs button.sel,.chs button:hover{border-color:var(--indigo);background:#e9e4d3}
.chs button .k{font-family:var(--ui);font-size:12px;color:var(--muted);margin-right:8px}

.dlg.hasp .nm{margin-left:150px}
.dlg .port{position:absolute;left:14px;bottom:calc(100% - 44px);width:136px;height:136px;object-fit:cover;border:3px solid var(--ink2);background:var(--paper2);box-shadow:0 4px 0 rgba(0,0,0,.35)}
.cimg{display:block;width:calc(100% + 52px);max-width:none;margin:-24px -26px 16px;aspect-ratio:16/9;object-fit:cover;border-bottom:3px solid var(--ink2)}
@media (max-width:560px){.dlg .port{width:84px;height:84px;left:10px;bottom:calc(100% - 26px)}.dlg.hasp .nm{margin-left:92px}.cimg{width:calc(100% + 36px);margin:-18px -18px 12px}}
.dlg.story{background:#efe6d0}
.dlg.story .tx{color:#4a3d2c;font-style:normal}
.routes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:10px;text-align:left}
.route{display:grid;grid-template-columns:84px 1fr;gap:4px 12px;align-items:start;background:rgba(241,234,216,.95);border:3px solid var(--ink2);padding:12px;box-shadow:0 5px 0 rgba(0,0,0,.4);color:var(--text)}
.route:hover,.route:focus-visible{border-color:var(--seal);transform:translateY(-2px)}
.route img{grid-row:span 2;width:84px;height:84px;object-fit:cover;border:2px solid var(--ink2)}
.route b{font-family:var(--display);font-weight:400;font-size:22px}
.route span{font-family:var(--ui);font-size:13px;line-height:1.6;color:var(--muted)}
.bt .pc img{width:96px;height:96px;object-fit:cover;border:2px solid var(--ink2);display:block;background:#d9cfb4}
.gl{margin-top:8px;padding:8px 10px;background:#e9e2cf;border-left:3px solid var(--indigo);font-family:var(--ui);font-size:14px;line-height:1.7;color:#3a3226;white-space:normal}
.gl b{font-family:var(--display);font-weight:400;color:var(--indigo);margin-right:8px;font-size:14px}
.dlg .gl{max-height:7.5em;overflow:auto}
.rec.tipr{border-left-color:var(--indigo);font-family:var(--ui);font-size:14px}
.hb.ping{animation:ping .8s ease-out}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(43,74,111,.8)}100%{box-shadow:0 0 0 12px rgba(43,74,111,0)}}
.mg .seq{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0}
.mg .arr{width:40px;height:40px;display:grid;place-items:center;border:2px solid var(--line);background:var(--paper2);font-size:22px;font-family:var(--ui)}
.mg .arr.ok{background:#dfe6ef;border-color:var(--indigo);color:var(--indigo)}
.mg .arr.cur{border-color:var(--seal);background:#fff3d6;transform:scale(1.12)}
.mg .cloth{position:relative;height:56px;background:repeating-linear-gradient(45deg,#f5ecd8 0 8px,#efe3c8 8px 16px);border:2px solid var(--ink2);margin-top:10px}
.mg .seam{position:absolute;left:4%;right:4%;top:50%;border-top:2px dashed #b9a987}
.mg .thread{position:absolute;left:4%;top:calc(50% - 2px);height:4px;background:repeating-linear-gradient(90deg,var(--seal) 0 10px,transparent 10px 16px);max-width:92%;transition:width .15s}
.mg .pad4{display:grid;grid-template-columns:repeat(4,56px);gap:8px;justify-content:center;margin-top:10px}
.mg .pad4 button,.mg .pad2 button{height:52px;font-size:22px;font-family:var(--ui);background:var(--paper2);border:2px solid var(--ink2);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.mg .pad2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.mg .pad2 button{font-size:16px}
.mg .gauge{height:14px;border:2px solid var(--ink2);background:var(--paper2);margin-top:10px}
.mg .gauge i{display:block;height:100%;width:0;background:var(--indigo);transition:width .1s}
.mg .wellbox{position:relative;height:150px;margin:10px auto 0;width:140px;background:linear-gradient(#8f8a7e,#6f6a60);border:3px solid var(--ink2);border-radius:6px}
.mg .rope{position:absolute;left:50%;top:0;width:2px;background:#cbb178;height:84%}
.mg .bucket{position:absolute;left:50%;transform:translateX(-50%);bottom:8%;font-size:30px}
.mg .pot{position:relative;width:150px;height:150px;margin:10px auto 0;border-radius:50%;background:radial-gradient(circle,#f4efe4 0 45%,#2b2622 46% 60%,#1d1813 61%);border:3px solid var(--ink2)}
.mg .ladle{position:absolute;left:50%;top:14%;width:6px;height:36%;margin-left:-3px;background:#8e6a44;transform-origin:50% 100%;transition:transform .12s}
.mg .next{position:absolute;left:0;right:0;bottom:-26px;text-align:center;font-family:var(--ui);font-size:13px;color:var(--muted)}
.mg .words{display:flex;flex-wrap:wrap;align-items:center;gap:2px;justify-content:center;margin:14px 0;font-size:22px;font-family:var(--display)}
.mg .gap{min-width:26px;height:40px;border:0;background:transparent;color:#b9a987;font-size:20px;border-radius:6px}
.mg .gap:hover{background:#efe3c8}
.mg .gap.on{color:var(--seal);font-weight:700;background:#f7e2dc}
.mg .dishes{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.mg .dish{font-family:var(--ui);font-size:14px;background:var(--paper2);border:2px solid var(--line);padding:6px 10px}
.mg .dish.sel{border-color:var(--seal);background:#fff3d6}
.mg .table{display:grid;grid-template-columns:1fr 1fr 1fr 70px;grid-template-rows:64px 64px;gap:8px;padding:12px;background:#8e5a34;border:3px solid #5a3b22;border-radius:8px}
.mg .slot{background:#a8744a;border:2px dashed #e8d2a8;color:#fff4de;font-family:var(--ui);font-size:13px;display:grid;place-items:center;line-height:1.2}
.mg .slot b{font-weight:500;display:block}
.mg .slot i{font-style:normal;opacity:.75}
.mg .s-b1{grid-column:1;grid-row:1}.mg .s-b2{grid-column:2;grid-row:1}.mg .s-b3{grid-column:3;grid-row:1}.mg .s-f1{grid-column:1;grid-row:2}.mg .s-f2{grid-column:2/4;grid-row:2}.mg .s-s{grid-column:4;grid-row:1/3}
.mg .mgmsg{min-height:1.6em;margin-top:8px}
.lnk{background:none;border:0;color:#e3c27a;text-decoration:underline;font-family:var(--ui);font-size:12px;margin-top:6px;cursor:pointer}
.tq{display:block;font-style:normal;font-size:12.5px;opacity:.8;margin-bottom:3px;border-left:2px solid currentColor;padding-left:7px}
.mg .cloth2{position:relative;height:96px;margin-top:10px;background:var(--cl);border:2px solid var(--ink2);border-radius:4px;overflow:hidden;box-shadow:inset 0 -6px 0 rgba(0,0,0,.08)}
.mg .cloth2 .weave{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.14) 0 2px,transparent 2px 5px),repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 2px,transparent 2px 5px)}
.mg .cloth2 .seam2{position:absolute;left:5%;right:5%;top:58%;border-top:2px dashed rgba(60,40,20,.35)}
.mg .cloth2 .st{position:absolute;top:calc(58% - 3px);height:5px;background:#b23a2a;border-radius:3px;box-shadow:0 1px 0 rgba(0,0,0,.35);animation:stIn .18s ease-out}
.mg .cloth2 .st.out{animation:stOut .25s forwards}
@keyframes stIn{from{transform:scaleX(0);transform-origin:left}to{transform:scaleX(1)}}
@keyframes stOut{to{opacity:0;transform:translateY(10px) rotate(20deg)}}
.mg .cloth2 .thr{position:absolute;top:calc(58% - 1px);height:3px;background:#b23a2a;opacity:.8;transition:left .15s,width .15s}
.mg .cloth2 .needle{position:absolute;top:calc(58% - 62px);width:9px;height:76px;margin-left:-4px;filter:drop-shadow(0 0 1px #222) drop-shadow(2px 3px 0 rgba(0,0,0,.25));transform:rotate(-28deg);transform-origin:50% 90%;transition:left .15s}
.mg .cloth2 .needle::before{content:"";position:absolute;left:1px;top:0;width:7px;height:100%;background:linear-gradient(90deg,#8d949c,#eef1f4 45%,#7d848c);border-radius:2px 2px 50% 50%/2px 2px 100% 100%}
.mg .cloth2 .needle i{position:absolute;left:3px;top:6px;width:3px;height:10px;background:var(--cl);border-radius:1px}
.mg .cloth2 .needle.dip{animation:dip .24s ease-in-out}
@keyframes dip{0%{transform:rotate(-28deg) translateY(0)}45%{transform:rotate(-8deg) translateY(22px)}100%{transform:rotate(-28deg) translateY(0)}}
.mg .cloth2 .needle.done{animation:lift .6s forwards}
@keyframes lift{to{transform:rotate(-60deg) translate(-10px,-30px);opacity:0}}
.mg .cloth2.tangle{animation:tangle .3s}
@keyframes tangle{25%{transform:translateX(-5px) rotate(-.6deg)}75%{transform:translateX(5px) rotate(.6deg)}}
.mg .cloth2.finish{box-shadow:0 0 0 4px #e3c27a,inset 0 -6px 0 rgba(0,0,0,.08);transition:box-shadow .3s}
.mg .cloth2 .spark{position:absolute;top:calc(58% - 14px);width:28px;height:28px;margin-left:-14px;border-radius:50%;pointer-events:none;opacity:0}
.mg .cloth2 .spark.on{animation:spark .35s ease-out}
@keyframes spark{0%{opacity:.9;box-shadow:0 0 0 0 rgba(255,236,170,.9)}100%{opacity:0;box-shadow:0 0 0 14px rgba(255,236,170,0)}}
.mg .sewbar{display:flex;justify-content:space-between;font-family:var(--ui);font-size:13px;margin-top:6px;min-height:1.4em}
.mg .sewbar .combo{color:var(--seal);font-weight:700}
.mg .sugi{position:relative;background:#f7f0dc;border:2px solid var(--ink2);padding:14px 16px 18px;margin-top:8px;font-family:var(--display);font-size:17px;line-height:1.9}
.mg .sugi .orig{position:absolute;right:8px;top:6px}
.mg .sugi p{margin:0}
.mg .sugsign{display:inline-block;margin-top:8px;color:var(--seal);font-family:var(--ui);font-size:14px;animation:stIn .3s}
.mg .sugsign i{font-style:normal;font-family:var(--display);font-size:22px;border:2px solid var(--seal);padding:0 6px;margin-left:6px}
.mg .picks{display:grid;gap:6px;margin-top:8px}
.mg .picks.grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.mg .picks button{font-family:var(--ui);font-size:14px;text-align:left;background:var(--paper2);border:2px solid var(--line);padding:8px 10px;cursor:pointer}
.mg .picks button.on{border-color:var(--indigo);background:#dfe6ef}
.mg .picks button:hover{border-color:var(--indigo)}
.mg .resp{margin-top:10px;font-family:var(--ui);font-size:14px;color:var(--seal)}
.mg .brushwrap{display:flex;justify-content:center;margin-top:10px}
.mg .brush{display:grid;justify-items:center;gap:4px;background:var(--paper2);border:2px solid var(--ink2);padding:8px 18px;cursor:pointer;touch-action:none;user-select:none;font-family:var(--ui);font-size:13px}
.mg .brush svg{width:160px;height:70px}
.mg .brush .stroke{fill:none;stroke:#1d1813;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.mg .route{display:flex;flex-wrap:wrap;gap:4px 0;align-items:center;margin:12px 0}
.mg .route .stop{display:flex;align-items:center;font-family:var(--ui);font-size:13px}
.mg .route .stop i{display:inline-block;width:18px;height:3px;background:var(--line)}
.mg .route .stop:first-child i{display:none}
.mg .route .stop b{font-weight:500;border:2px solid var(--line);background:var(--paper2);padding:3px 7px;min-width:34px;text-align:center}
.mg .route .stop.on i{background:var(--indigo)}
.mg .route .stop.on b{border-color:var(--indigo);background:#dfe6ef;color:var(--indigo)}
.mg .route .stop.cur b{border-color:var(--seal);border-style:dashed}
#mini{position:fixed;right:12px;top:calc(58px + env(safe-area-inset-top,0px));z-index:4;border:2px solid var(--ink2);box-shadow:0 3px 0 rgba(0,0,0,.35);background:#1b1a17;image-rendering:pixelated;display:none;pointer-events:none}
@media (max-width:560px){#mini{top:auto;bottom:calc(120px + env(safe-area-inset-bottom,0px));right:10px;transform:scale(.8);transform-origin:right bottom}}
body.talking #mini{opacity:.35}
.mg .psg{position:relative;background:#f7f0dc;border:2px solid var(--ink2);padding:10px 40px 10px 12px;margin:8px 0;font-family:var(--display);font-size:16.5px;line-height:1.9;max-height:12em;overflow:auto}
.mg .psg .orig,.mg .sugi .orig{position:absolute;right:8px;top:6px;display:inline-grid;place-items:center;width:26px;height:26px;border:2px solid var(--seal);color:var(--seal);font-family:var(--display);font-size:13px;transform:rotate(-6deg)}
.mg .psg .hit{background:#dfe6ef;color:var(--indigo);font-weight:700;border-radius:3px;padding:0 2px}
.histlnk{margin-left:auto;font-family:var(--ui);font-size:12px;background:transparent;border:1.5px solid var(--line);padding:2px 8px;color:var(--muted)}
.histlnk:hover{border-color:var(--indigo);color:var(--indigo)}
.dlg .orig+.histlnk{margin-left:8px}
#hist{z-index:90}
#hist .rec.plain{border-left-color:var(--line);color:#4a3d2c}
#hist .seal-s{width:18px;height:18px;font-size:10px;vertical-align:middle}
.mg .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:8px}
.mg .cards button{display:grid;gap:2px;text-align:left;background:#6d4b2c;color:#f1ead8;border:2px solid var(--ink2);padding:10px;min-height:70px;font-family:var(--ui);font-size:13px}
.mg .cards button b{font-family:var(--display);font-weight:400;font-size:17px}
.mg .cards button.on{background:#f7f0dc;color:var(--text);border-color:var(--gold);animation:stIn .25s}
.mg .cards button.on span{color:var(--muted)}
.mg .picks button:disabled{opacity:.6;cursor:default}
.ek{font-weight:700;color:#2a1d10;background:linear-gradient(transparent 58%,rgba(242,201,76,.6) 58%);padding:0 1px}
.eb2{font-weight:700;color:var(--seal)}
.alias{font-family:var(--ui);font-size:12.5px;color:var(--muted)}
.mg .arena{position:relative;height:90px;margin-top:10px;background:linear-gradient(#8a9a5a,#6f7f48);border:2px solid var(--ink2);overflow:hidden}
.mg .arena .zone{position:absolute;top:0;bottom:0;width:13%;background:rgba(179,54,43,.28);border-left:2px dashed var(--seal);border-right:2px dashed var(--seal)}
.mg .arena .zl{left:30%}.mg .arena .zr{right:30%}
.mg .arena .ballc{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7cf,#f5cd4f 40%,#b3800f);box-shadow:0 0 16px 4px rgba(255,222,120,.7)}
.mg .arena .ballc.bump{animation:bump .25s}
@keyframes bump{50%{transform:scale(1.35)}}
.mg .arena .tg{position:absolute;top:22px;font-size:40px;line-height:1}
.mg .belly{position:relative;height:110px;margin-top:10px;border-radius:50px;background:radial-gradient(ellipse at center,#6b1f1a,#3a0f0c 70%);border:3px solid #1d1813;overflow:hidden}
.mg .belly .organ{position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7cf,#f5cd4f 40%,#b3800f);box-shadow:0 0 18px 6px rgba(255,222,120,.6)}
.mg .belly .gauge2{position:absolute;left:12px;right:12px;bottom:10px;height:10px;background:rgba(0,0,0,.35);border:1px solid #f1ead8}
.mg .belly .gauge2 i{display:block;height:100%;width:0;background:#f2c94c;transition:width .15s}
.mg .belly .bl{position:absolute;left:14px;bottom:22px;color:#f1ead8;font-family:var(--ui);font-size:12px}
.mg .scrolls{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}
.mg .scrolls figure{margin:0;text-align:center;font-family:var(--ui);font-size:13px;color:var(--muted)}
.mg .scrolls svg{width:100%;max-width:170px}
.sheet.itemget{text-align:center;position:relative;overflow:hidden}
.itemget>*:not(.rays){position:relative}
.itemget .itimg{display:block;margin:6px auto 10px;width:min(240px,58vw);border-radius:8px;border:3px solid #8a6a1f;box-shadow:0 0 40px 8px rgba(255,210,110,.6);animation:itrise .9s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes itrise{from{transform:translateY(50px) scale(.5);opacity:0}}
.itemget .rays{position:absolute;left:50%;top:140px;width:640px;height:640px;margin:-320px 0 0 -320px;background:repeating-conic-gradient(rgba(255,215,120,.22) 0 9deg,transparent 9deg 18deg);border-radius:50%;animation:itspin 14s linear infinite;pointer-events:none}
@keyframes itspin{to{transform:rotate(360deg)}}
.thumb{float:right;width:52px;height:52px;object-fit:cover;border:2px solid var(--line);border-radius:4px;margin-left:6px}
.mg .unroll{overflow:hidden;animation:unroll 1.1s ease-out both;border:2px solid #6d4b2c}
.mg .unroll img{display:block;width:100%}
.mg .scrolls figure:nth-child(2) .unroll{animation-delay:1s}
@keyframes unroll{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
.mg .backwrap{display:grid;grid-template-columns:1fr 110px;gap:10px;align-items:center;margin-top:8px}

<script>
const BODY=new Set(["세종대왕 시절에 평안도 철산군에 한 사람이 있었는데 성은 배씨요, 이름은 무룡이었다.","그는 본디 향반으로 좌수를 지냈을 정도로 성품이 매우 순후하고 가산이 넉넉하여 부러울 것이 없었지만, 다만 슬하에 일점 혈육이 없으므로 부부는 매양 슬퍼하였다.","그러던 어느 날, 부인 장씨가 몸이 곤하여 침상을 의지하고 조는 동안, 문득 한 선관이 하늘에서 내려와 꽃 한 송이를 주기에 부인이 받으려 할 때 홀연 회오리바람이 일며 그 꽃이 변하여 한 선녀가 되어 완연히 부인의 품속으로 들어오는지라.","부인이 놀라 깨어 보니 남가일몽이었다.","부인이 좌수를 향하여 꿈 이야기를 하며 괴이하게 여겼다.","좌수가 이 말을 듣고,","우리의 무자함을 하늘이 불쌍히 여기사 귀자를 점지하심이오.","하며,서로 기뻐하였다.","과연 그 날부터 태기가 있어 십 삭이 차매, 하루는 밤중에 향기가 진동하더니 순산하여 옥녀를 낳았다.","아기의 용모와 기질이 특이하여 좌수 부부는 크게 사랑하며 이름을 장화라 짓고 장중 보옥같이 길렀다.","장화가 두어 살이 되면서 장씨 또다시 태기가 있었다.","좌수 부부는 주야로 아들 낳기를 바랐으나 역시 따를 낳았다.","마음에는 서운하나 할 수 없이 이름을 홍련이라 하였다.","장화 ․홍련 자매가 점점 자라가며 얼굴이 화려하고 기질이 기묘할 뿐더러 효행이 뛰어나니, 좌수 부부는 형제의 자라남을 보고 사랑함이 비길 데 없었다.","그러나 너무 숙성함을 매우 염려하였다.","그러던 가운데 한편 시운이 불행하여 장씨는 홀연히 병을 얻어 자리에 눕게 되었다.","좌수와 장화가 정성을 다하여 주야로 약을 썼지만, 증세가 날로 위중할 뿐이요, 조금도 효험이 없었다.","장화는 초조하여 하늘에 축수하며 모친이 회춘하기를 바랐지만, 이 때 장씨는 자기의 병이 낫지 못하리라 짐작하고, 나어린 두 딸의 손을 잡고 좌수를 청하여 슬퍼하며,","첩이 전생에 죄가 많아 이 세상에 오래 살지 못할 것 같습니다.","죽는 것은 슬프지 않지만, 장화 자매를 기를 사람이 없사오니 지하에 갈지라도 눈을 감지 못할 만큼 슬프니,  이제 골수에 맺힌 한을 가슴에 품고 죽으려 합니다.","외로운 혼백이 바라는 바는 다름이 아니오라 첩이 죽은 후에 다른 여인을 취하실진대 낭군의 마음이 자연 변하기 쉬울 것이니 그것을 두려워합니다.","바라건대 낭군은 첩의 유언을 저 버리지 마시고 지난날의 정의를 생각하시고, 이 두 딸을 불쌍히 여겨 장성한 후에 좋은 가문에 배필을 얻어 봉황의 짝을 지어 주신다면 첩이 비록 어두운 저승 속에서라도 낭군의 은택을 감축하여 결초보은하겠습니다.","하고 길이 탄식한 후, 이내 숨을 거두었다.","장화는 동생을 안고 하늘을 우러러 통곡하니, 그 가련한 정경은 보는 사람으로 하여금 철석 간장이 녹아 내리는 듯하였다.","그럭저럭 장삿날이 다달아 선산에 안장하고 장화는 효심을 다하여 조석으로 상식을 받들며 주야오 과상하엿다.","세월이 여류하여 어느덧 삼상이 지나갔다.","그러나 장화 형제의 망극함은 더욱 새로웠다.","이 때 좌수는 비록 망처의 유언을 생각하였지만 후사를 안 돌아볼 수도 없어서, 이에 혼처를 두루 구하였으나,원하는 여인이 없으므로 부득이 허씨라는 여인에게 장가를 들었다.","허씨의 용모를 말하자면 두 볼은 한 자가 넘고, 눈은 퉁방울 같고,  코는 질병 같고, 입은 메기 같고, 머리털은 돼지털 같고, 키는 장승만 하고, 소리는 이리 소리 같고, 허리는 두 아름이나 되는 것이 게다가 곰배팔이요, 수종다리에 쌍언청이를 겸하였고, 그 주둥이를 썰어 내면 열 사발은 되고, 얽기는 콩멍석 같으니 그 형상은 차마 바고 보기 어려운 데다가 그 심지가 더욱 불량하여 남이 못 할 노릇만을 골라 가며 행하니, 집에 두기가 단 한시인들 난감하였다.","그래도 그것이 계집이라고 그 달부터 태기가 있어 연달아 아들 삼 형재를 낳았다.","좌수는 그로 말미암아 어찌할 바를 모르니 매양 딸과 더불어 죽은 장씨 부인을 생각하며, 잠시라도 두 딸을 못 보면 삼추같이 여기고, 돌아오면 먼저 딸의 침실로 들어가 손을 잡고 눈믈을 흘리며,","너희 자매들이 깊이 규중에 있으면서, 어미 그리워함을 늙은 아비도 매양 슬퍼한다.","하며 가련히 여기는 것이었다.","허씨는 그럴수록 시기하는 마음이 대발하여 장화 ․홍련을 모해하고자 꾀를 생각하였다.","이에 좌수는 허씨의 시기함을 짐작하고 허씨를 불러 크게 꾸짖었다.","우리는 본래 가난하게 지내다가, 전처의 재물이 많아 지금 풍부히 살고 있소.","그대의 먹는 것이 다 전처의 재물이니 그 은혜를 생각하면 크게 감동해야 맏땅한데, 저 어린것들을 심히 괴롭게 하니, 다시는 그러지 마오.","하고, 조용히 타일렀지만 시랑 같은 그 마음이 어찌 뉘우치겠는가.","그 후로는 더욱 불측하여 두 자매를 죽일 뜻을 주야로 생각하였다.","하루는 좌수가 내당으로 들어와 딸의방에 앉으며 두 딸을 살펴보니, 딸 자매가 서로 손을 잡고 슬픔을 머금고 눈물로 옷깃을 적시기에, 좌수가 이것을 보고 매우 측은히 여겨 탄식하며,","이는 반드시 죽은 어미를 생각하고 슬퍼함이로다.","하고, 역시 눈물을 흘렸다.","너희들이 이렇게 장성하였으니, 너희 모친이 살아 있었다면 오죽이나 기쁘겠느냐.","그러나 팔자가 기구하여 허씨 같은 계모를 만나 구박이 자심하니, 너희들의 슬퍼함을 짐작하겠다.","이후에 이런 연고가 또 있으면 내가 처치하여 너희 마음을 편안케 하리라.","하고 나왔다.","이 때 흉녀 허씨가 창 틈으로 이 광경을 엿보고 더욱 분노하여 흉계를 생각하다가 문득 깨닫고, 제 자식 장쇠를 불러 큰 쥐 한 마리를 잡아오게 하였다.그러고는 그것을 껍질을 벗기고 피를 발라, 낙태한 형상을 만들어 장화가 자는 방에 들어가 이불 밑에 넣고 나왔다.","좌수가 들어오기를 기다려 이것을 보이려고 하였는데 마침 좌수가 외당에서 들어왔다.","허씨가 좌수를 보고 정색하며 혀를 차는지라, 괴이하게 여긴 좌수가 그 연고를 물었다.","집안에 불측한 변이 있으나 낭군은 필시 첩의 모해라 하실 듯하기에 처음에는 발설치 못하였습니다.","낭군은 친 어버이라, 나오면 이르고 들어가면 반기는 정을 자식들이 전혀 모르고 부정한 일이 많으나, 내 또한 친 어미가 아니므로 짐작만 하고 있었는데 오늘은 늦도록 기동치 아니하기에 몸이 불편하가 하여 들어가 보니, 과연 낙태를 하고 누웠다가 첩을 보고 미처 수숩치 못하여 쩔쩔매는 것이었습니다.","그래서 첩의 마음에 놀라움이 컸지만, 저와 나만 알고 있거니와 우리는 대대로 양반이라 이런 일이 누설되면 무슨 면목으로 세상을 살아가겠습니까.","좌수는 크게 놀라 이에 부인의 손을 이끌고 여아의 방으로 들어가 이불을 들추어 보았다.","이 때 장화 자매는 잠이 깊이 들어 있었으니,허씨가 그 피묻은 쥐를 가지고 날뛰었다.","용렬한 좌수는 그 흉계를 모르고 놀라며,","이 일을 장차 어찌하리오.","하며 고심하였다.","이 때 흉녀가 하는 말이,","이일이 매우 중난하니 남이 모르게 죽여 흔적을 없이 하면, 남은 이런 줄은 모르고 첩이 심하여 애매한 전실 자식을 모해하여 죽였다고 할 것이요, 남이 알면 부끄러움을 면치 못할 것이니 차라리 첩이 먼저 죽어 모르는게 나을까 합니다.","하고 거짓 자결하는 체하니,  저 미련한 좌수는 그 흉계를 모르고 급히 달려들어 붙들고 빌면서,","그대의 진중한 덕은 내 이미 아는 바이니, 빨리 방법을 가르치면 저 아이를 처치하겠소.","하며 울거늘, 흉녀는 이 말을 듣고,","이제는 원을 이룰 때가 왔다.","하고, 마음에 기꺼워하면서도 겉으론 탄식하여 하는 말이,","내 죽어 모르고자 하였더니, 낭군이 이토록 과념하시니 부득이 참거니와, 저 아이를 죽이지 아니하면 장차 문호에 화를 면치 못할 것입니다.","기세양난이니 빨리 처치하여 이 일이 드러나지 않게 하십시오.","하였다.","좌수는 망처의 유언을 생각하고 망극하나, 일변 분노하여 처치할 묘책을 의논하니, 흉녀는 기뻐하며,","장화를 불러 거짓말로 속여 저희 외삼촌 댁에 다녀오게 하고, 장쇠를 시켜 같이 가다가 뒤 연못에 밀쳐 넣어죽이는 것이 상책일까 합니다.","좌수가 듣고 옳게 여겨 장쇠를 불러 이리이리하라고 계교를 가르쳐 주었다.","이 때 두 소저는 죽은 어머니를 생각하고 슬픔을 금치 못하다가 잠이 깊이 들었으니, 어찌 흉녀의 이런 불측함을 알 수 있었을까?","장화가 잠을 깨어 심신이 울적하므로 괴이하게 여겨 다시 잠을 이루지 못하고 일어나 앉아 있는데, 부친이 부르시기에 깜짝 놀라서 즉시 나아가니 좌수가 말하기를,","너희 와삼촌 집이 여기서 멀지 않으니 잠시 다녀오느라.","하였다.","장화는 너무나 이외의 영을 들었으므로 일변 놀랍고 일변 슬퍼 눈물을 머금고 말씀드렸다.","소녀 오늘까지 문 밖을 나가 본 일이 없었는데, 부친은 어찌하여 이 깊은 밤에 알지 못하는 길을 가라 하십니까?","좌수가 대노하여 꾸짖으며,","장쇠를 데리고 가라 하였거늘 무슨 잔말을 하여 아비의 영을 거역하느냐.","하므로 장화 이 말을 듣고 방성대곡하여,","부친께서 죽어라 하신들 어찌 분부를 거역하겠습니까마는 밤이 깊었기로 어린 생각에 사정을 아뢸 따름입니다.","분부 이러하시니 황송하지만, 다만 부탁이오니 밤이나 새거든 가게 해 주십시오.","하였더니 좌수 비록 용렬하나, 자식의 정에 끌려 망설이므로 흉녀 이렇듯 수작함을 듣고 갑자기 문을 발길로 박차며 꾸짖어 말하였다.","너는 어버이 영을 순수히 따라야 마땅하거늘, 무슨 말을 하여 부명을 어기느냐.","하고 호령하니 장화는 이에 더욱 서러우나 할 수 없이 울며,","아버님 분부가 이러하시니, 다시 여쭐 말씀이 없습니다.","분부대로 하겠습니다.","하고 침실로 들어가 홍련을 불러 손을 잡고 울면서,","부친의 뜻을 알지 못하거니와 무슨 연고가 있는지 이 밤중에 외가에 다녀오라 하시니 마지못해 가긴 가지만, 이 길이 아무래도 불길하구나.","다만 슬픈 마음은 우리 자매가 모친을 여의고 서로 의지하여 세월을 보내되 한시라도 떠남이 없이 지내더니, 천만 뜻밖에 이 일을 당하여 너를 적적한 빈방에 혼자 두고 갈 일을 생각하면 가슴이 터지고 간장이 타는 내 심사는 청천일장지로다 다 기록치 못할 것이다.","아무쪼록 잘 있거라.","내 가는 길이 좋지 못할 듯하나 되도록 것이니 그 사이 그리움이 있을지라도 참고 기다려라.","옷이나 갈아 입고 가야겠다.","하고, 옷을 갈아 입은 후, 장화는 다시 손을 잡고 울며 아우에게 경계하여,","너는 부친과 계모를 극진히 섬겨 잘못함이 없게 하고 내가 돌아오기글 기다리면, 내 가서 오랫동안 있지 않고 수삼 일에 다녀오겠다.","그 동안 그리워 어찌하여 너를 두고 가는 마음 측량할 길 없으니, 너는 슬퍼 말고 부디 잘 있거라.","말을 마치고 대성통곡하며 손을 붙잡고 서로 헤어지지 못하니,슬프다!","생시에 그지없이 사랑하던 그 모친은 어찌 이런 때를 당하여 저 자매의 형상을 굽어살피지 못하는가.","이 때 흉녀 밖에서 장화의 이렇듯 함을 듣고는 들어와, 시랑 같은 소리를 지르며 말하였다.","네 어찌 이렇게 요란히 구느냐?","하고 장쇠를 불러,","네 누이를 데리고 속히 외가에 다녀오라 하였거늘 그저 있으니 어쩐 일이냐?","그러자, 돼지 같은 장쇠는 바로 염라대왕의 분부나 받은 듯이 소리를 벼락같이 질러 어깨춤을 추며 삼간마루를 떼구르며,","누님은 빨리 나와요.","부명을 거역하여 공연히 나만 꾸지람 듣게 하니 이 아니 원통하오.","하며 재촉이 성화 같으므로 장화는 어쩔 수 없이 홍련의 손을 떨치고 나오려 하였다.","이 때 홍련이 언니의 옷자락을 잡고 울면서,","우리 형제 잠시도 떨어지지 않았었거늘, 갑자기 오늘은 나를 버리고 어디를 가려고 합니까?","하며 쫓아 나오니, 장화는 홍련의 형상를 보며 간장이 마디마디 끊어지는 듯하지만, 홍련을 달래며,","내 잠시 다녀오겠으니 울지 말고 잘 있거라.","하며 설움에 잠겨 말끝을 맺지 못하니, 노복들도 이 광경을 보고 눈물 아니 흘리는 자가 없었다.","홍련이 언니의 치마폭을 잡고 놓지 않거늘, 흉녀가 들이닥쳐 홍련의 손을 뿌리치며,","네 형이 외가에 가는데 네 어찌 이처럼 요망스럽게 구느냐.","하며 꾸짖으므로, 홍련은 맥없이 물러섰다.","흉녀가 장쇠에게 넌지시 눈짓하니 장쇠의 재촉이 성화 같았다.","장화는 마지못해 홍련을 이별하고 부친께 하직하고 말에 올라 통곡하며 가는 것이었다.","장쇠가 말을 급히 몰아 산골짜기로 들어가 한 곳에 다다르니, 산은 첩첩천봉이요 물은 잔잔 백곡인지라, 초목이 무성하고 송백이 자욱하여, 인적이 적막한데 달빛만 휘영청 밝고 구슬픈 두견 소리 일촌간장을 다 끊어 놓는다.","장화가 굽어 보니 송림 가운데 한 못이 있는데 크기가 사십여 리요, 그 깊이는 알지 못할 정도였다.","한 번 보니 정신이 아득하고 물소리만 처량한데, 장쇠 말을 잡고 장화를 내리라 하니 장화는 깜짝 놀라며 큰 소리로 장쇠를 나무랐다.","이 곳에 내리라 함은 어쩐 일이냐?","하니, 장쇠가 대답하길,","누이의 죄를 알 것이니 어찌 물으오?","그대를 외가에 가라 함은 정말이 아니라, 그대 실햄함이 많으되, 계모 착하신 고로 모르는 체하시더니 이미 낙태한 일이 나타났으므로, 나를 시켜 남이 모르게 이 못에 넣고 오라 하기에, 이 곳에 왔으니 속히 물에 들어가오.","하며 잡아 내리는 것이었다.","장화가 이 말을 들으니 청천벽력이 내리는 듯 넋을 읽고 소리를 지르며,","하늘도 야속하오, 이 일이 웬일이요?","무슨 일로 장화를 내시고 또 천고에 없는 누명을 씌워 이 깊은 못에 빠져 죽어 속절없이 원혼이 되게 하시는고?","하늘이여 굽어살피소서.","장화는 세상에 난 후로 문 밖을 모르거늘, 오늘날 애매한 누명을 쓰오니 전생에 죄악이 그렇게 중하던가, 우리 모친은 어찌 세상을 버리시고, 슬픈 인생을 남겼던고,간악한 사람의 모해를 입어 단불에 나비죽듯 죽는 것은 슬프지 않지만, 원통한 이 누명을 어느 시절에 씻으며 외로운 저 동생은 장차 어찌될 것인가?","하며 통곡하니 기절하니, 그 정상은 목석간장이라도 서러워하련마는, 저 불측하고 무정한 장쇠놈은 서서 다만 재촉할 뿐이었다.","이 적막한 산중에 밤이 이미 깊었는데, 아무래도 죽을 인생 발악해야 무엇하나 어서 바삐 물에 들라.","하니 장화 정신을 진정하고,","나의 망극한 정지를 들으라.","너와 나는 비록 이복이나 아비 골육은 한가지라, 전에 우리를 우애하던 정을 생각하여 영영 황천으로 돌아가는 목숨을 가련히 여겨 잠시 말미를 주면, 삼촌 집에도 가고 망모의 묘에 하직이나 하고 외로운 홍련을 부탁하여 위로하고자 하니, 이는 내 목숨을 보존코자 함이 아니라, 변명하면 계모의 시기가 있을 것이요, 살고자 하면 부명을 거역하는 것이니 일정한 명대로 하려니와, 바라건대 잠시 말미를 주면 다녀와 죽음을 청하겠다.","하며 비는 소리, 애원이 처절하나 목석 같은 장쇠 놈은 조금도 측은한 빛이 없이 마침내 듣지 않고 재촉이 성화 같았다.장화는 더욱 망극하여 하늘을 우러러 통곡하며,","명천은 이 억울한 사정을 살피소서.","이 몸 팔자 기박하여, 칠 세에 어미를 여의고 자매 서로 의지하여 서산에 지는 해와 동녘에 돋는 달을 대할 때면 간장이 슬퍼지고, 후원에 피는 꽃과 섬돌에 나는 풀을 볼 적이면 비감하여 눈물이 비오듯 지내왔는데, 십년 후 계모를 얻으니 성품이 불측하여 구박이 자심하온지라 서러운 슬픈 마음을 이기지 못하오나, 밝으면 부친을 따르고 해가 지면 망모를 생각하며 자매 서로 손을 잡고, 기나긴 여름날과 적막한 가을밤을 장우탄탄으로 살아왔었는데 궁흉극악한 계모의 독수를 벗어나지 못하옵고 오늘날 물에 빠져 죽사오니 이 장화의 천만 애매함을 천지․일월․성신ᄋ든 바로잡아 주소서.","홍련의 일생을 어여삐 여기셔서 저 같은 인생을 본받게 하지 마옵소서.","하고 장쇠를 돌아보며,","나는 이미 누명을 쓰고 죽거니와 저 외로운 홍련을 어여삐 여겨 잘 인도하여, 부모에게 호도하고 길이 무량함을 바란다.","하며 왼손으로 치마를 걷어잡고 오른손으로 월귀탄을 벗어 들고 신발을 벗어 못가에 놓고, 발을 구르며 눈물을 비오듯 흘리고 오던 길을 향하여 실성 통곡하며,","불쌍하구나, 홍련아, 적막한 깊은 규중에 너 홀로 남았으니, 가엾은 네 인생이 누구를 의지하고 살아간단 말이냐.","너를 두고 죽는 나는 쓰라린 이 간장이 구비구비 다 녹는다.","말을 마치고 만경창파에 나는 듯이 뛰어드니 참으로 애닯도다.","갑자기 물결이 하늘에 닿으며 찬바람이 일어나고 월광이 무색한데, 산중으로부터 큰 범이 내달아 꾸짖기를,","네 어미 무도하게 애매한 자식을 모해하여 죽이니 어찌 하늘이 무심하겠느냐.","하며 달려들어 장쇠놈의 두 귀와 한 팔, 한 다리를 떼어먹고 온데간데없으니 장쇠 기절하여 땅에 거꾸러지니 장화의 탔던 말이 크게 놀라 집으로 돌아왔다.","흉녀는 장쇠를 보내고 밤이 깊도록 아니 오므로 매우 이상히 여기는데 갑자기 장화가 타고 간 말이 소리를 지르고 달려오기에, 흉녀 생각하기를 장화를 죽이고 온 줄 알고 내다본즉, 말은 온몸에 땀을 흘리고 들어오는데 사람은 없는지라, 흉녀는 크게 놀라 이에 노복을 불러 불을 밝히고 말 오던 자취를 더듬어 찾아가게 하였다.","이윽고 한 곳에 다다라 보니, 장쇠가 거꾸러졌기에 놀라 자세히 살펴보니, 한 팔 , 한 다리와 두 귀가 없고 피를 흘리며 인사불성이라 모두가 놀라 어찌할 바를 몰랐다.","그 때 문득 향내가 진동하며 찬바람이 소슬하므로 괴이하게 여겨 사방을 두루 살펴보니 향내가 못 가운데서 나는 것이었다.","노복이 장쇠를 구하여 오니, 그 어미 놀라 죽시 약을 먹이고 상한 곳을 동여 주니, 장쇠 비로소 정신을 차렸다.","흉녀가 크게 기꺼워하며 그 사연을 물은즉,장쇠는 전후 사연을 다 말하였다.","그 말을 들은 흉녀는 더욱 원망하며 홍련을 마저 죽이려고 주야로 생각하였다.","그러던 중 홍련이 또한 집안일을 전혀 모르다가 집안이 소란함을 보고 괴이하게 여겨 계모에게 그 연고를 물으니,","장쇠는 요괴로운 네 형을 데리고 가다가 길에서 범을 만나 물려서 병이 중하다.","하기에 홍련이 다시 사연을 물은즉, 흉녀는 눈을 흘기며,","네 무슨 요사스런 말을 이토록 하느냐?","하고, 자리를 떨치고 이러나므로, 홍련이 이렇듯 박대함을 보고 가슴이 터지는 듯하며 일신이 떨려, 제 방으로 돌아와 형을 부르며 통곡하다가 홀연 잠이 들었다.","비몽사몽간에 물 속에서 장화가 황룡을 타고 북해로 향하거늘, 홍련이 내달아 물으려 하니 장화는 본 체도 안 하는 것이었다.","홍련이 울며,","형님은 어찌 나를 본 체도 안 하시고 혼자 어디로 가십니까?","하니,그제서야 장화가 눈물을 뿌리며,","이제는 내 몸이 길이 달라서 내 옥황상제께 명을 받아 삼신산으로 약을 캐러 가는데, 길이 바쁘기로 정회를 베풀지 못하지만 너는 나를 무정타고 여기지 말아라.","내 장차 때를 보아 너를 데려가마.","하며 수작할 즈음에 장화가 탄 용이 소리를 지르거늘, 홍련이 깨달으니 침상일몽이었다.","기운이 서늘하고 땀이 나서 정신이 아득한지라, 홍련은 이에 부친께 이 사연을 말씀하며 통곡하여 하는 말이,","오늘을 당하여 소녀의 마음이 무엇을 잃은 듯하여 자연히 슬프오니 형이 이번에 가서 필경 무슨 연고가 있어 사람의 해를 입었나 봅니다.","하고 실성통곡하였다.","좌수가 여아의 말을 들어 보니, 숨통이 막혀 한 마디 말도 못하고 다만 눈물만 흘리는 것이었다.","흉녀가 곁에 있다가 왈칵 성을 내며,","어린아이가 무슨 말을 해서 어른의 마음을 이다지도 슬프게 이렇듯 상심케 하느냐.","하며 등을 밀어 내기에 홍련이 울며 나와 생각하기를,","내 꿈 이야기를 여쭈니 부친은 슬퍼하시며 아무 말도 못 하시고, 계모는 낯빛을 바꾸니 이렇듯 구박하니, 이는 반드시 이 가운데 무슨 연고가 있다.","하며 그 허실을 몰라 애쓰고 있었다.","하루는 흉녀가 나가고 없기에 장쇠를 불러 달래며 언니의 행방을 탐문하였더니, 장쇠는 감히 속이지 못하여 장화의 전후 사연을 거짓없이 말하였다.","그제야 언니가 애매하게 죽은 사실을 알고 깜짝 놀라 기절하였다가 겨우 정신을 차려 형을 부르며,","가련할사 형님이여!","불측할사 흉녀로다!","자상한 우리 형님, 이팔청춘 꽃다운 시절에 망측한 누명 몸에 쓰고 창파에 몸을 던져 천추 원혼되었으니, 뼈에 새긴 이 원한을 어찌하여 풀어 볼까, 참혹하다 우리 형님, 가련한 이 동생을 적막한 공방에 외로이 남겨 두고 어디 가서 안 오시나.","구천에 돌아간들 이 동생이 그리워서 피눈물 지으실 제 구곡간장이 다 녹았을 것이로다.","고금에 이르도록 이런 억울하고 원통한 일이 또 어디있으리요.","하늘이시여 살피시옵소서.","소녀 3세에 어미를 잃고 언니를 의지하여 지내 왔는데, 이 몸의 죄가 많아 모진 목숨이 외로이 남았다가 이런 변을 또 당하니, 언니와 같이 더러운 꼴 보지 말고 차라리 이 내 몸이 일찍 죽어 외로운 혼백이라도 언니를 따라갈까 하나이다.","말을 마치니 눈물은 비오듯 하며 정신이 아득한지라, 아무리 형의 죽은 곳을 찾아가고자 하나 규중 처녀의 몸으로 문 밖 길을 모르니, 어찌 그 곳을 찾으랴?","침식을 전폐하고 밤낮을 한탄할 뿐이었다.","하루는 청조 한 마리가 날아와서 백화가 말발한 사이를 오락가락하기에 홍련이 심중에 헤아리기를,","내 형님의 죽은 곳을 몰라 주야로 궁금하여 한이 되는데 저 청조 비록 미물이나마 저렇듯 왕래하니 필경 나를 데려가려 왔나 보다.","하며 슬픈 정회를 진정치 못하여 좌불안석하였다.","그러다가 문득 보니 청조는 간 곳이 없거늘, 서운한 마음이 비할 데 없었다.","날이 다시 밝으매 홍련이 또 청조가 오기를 기다렸으나 끝내 오지 않아 슬픔을 이기지 못하여 창을 의지하고 생각하기를,","이제는 청조가 오지 않아도 언니 죽은 곳을 찾아가려니와, 이 일을 부친께 말씀하면 못 가게 하실 테니, 이 사연을 기록하여 두고 가야 하겠다.","하고 즉시 지필을 내어 유서를 썼다.","슬프다, 일찍이 모친을 여의고 형제가 서로 의지하여 세월을 보냈더니, 천만 뜻밖에 형이 사람의 불측한 모해를 입어 죄 없이 몹쓸 누명을 쓰고 마침내 원혼이 되니, 어찌 슬프지 않으며 원통하지 않겠습니까? 홍련은 부친 슬하에 이미 십여 년을 모셨다가 오늘날 가련한 형을 쫓아가매, 지금 이 후로는 부친의 용모를 다시 뵙지 못하고 음성조차 들을 길이 없습니다. 이런 일을 생각하면 눈물이 앞을 가려 가슴이 메이는지라 바라건대 부친은 불초 여식을 생각지 마시고 만수 무강하십시오.","이 때는 오경이라 월색이 만정하고 청풍이 소슬하였는데, 문득 청조가 날아와 나무에 앉으며 홍련을 보고 반기는 듯 지저귀는 것이었다.","그것을 보며 홍련이 이르기를,","네 비록 날짐승이나 우리 형님 계신 곳을 가르쳐 주려 왔느냐?","그 청조가 듣고 응하는 듯해서 홍련이 다시 말하기를,","네 만일 나를 가르쳐 주려 왔거든 길을 인도하면 너를 따라가겠다.","하니, 청조는 고개를 조아리며 응하는 듯하기에 홍련이 말하기를,","그러하면 네 잠시 머물러 있어라.","함께 가자.","하고 유서를 벽상에 붙이고 방문을 나오며 일장통곡하여 말하기를,","가련하다, 내 신세여!","이 집을 나가면 언제 다시 이 문전을 보겠는가.","하며 청조를 따라갔다.","몇 리를 못 가서 동방이 밝아오므로 점점 나아가매, 청산은 중중하고 장송은 울울한데 백조는 슬피 울어 사람의 심회를 돋우었다.","청조가 한 못가에서 주저하기에 홍련이 좌우를 살펴보니, 물 위에 오색구름이 자욱한 속에서 슬픈 울음소리가 나며 홍련을 불러 이르는 말이,","너는 무슨 죄로 천금같이 귀중한 목숨을 속절없이 이 곳에다 버리려고 하느냐.","사람이 한 번 죽으면 다시 살지 못하나니, 가련하다 홍련아, 세상일은 헤아리기 힘드니 이런 일일랑 다시 생각지 말고 어서 돌아가 부모님께 효도하고 성현 군자를 만나 아들 딸 고루 낳아 기르며, 돌아가신 어머님 혼령을 위로하여라.","하는 것이었다.","홍련은 이것이 형의 소리임을 알아 듣고 급히 소리질러 말하기를,","형님은 전생에 무슨 죄로 나를 두고 이 곳에 와 외로이 있습니까?","내 형님을 버리고 혼자 살 길이 없으니 한가지로 돌아다니고자 합니다.","하고 또 들으니 공중에서 울음소리가 그치지 아니하고 슬피 울기에, 홍련이 더욱 서러워 정신을 차리지 못하다가 겨우 진정하여 하늘에 절하며 축수하여 비는 말이,","비나이다 비나이다.","빙옥같이 맑은 우리 형님 천추에 몹쓸 누명 설원하여 주십시오.","천지신명은 이 홍련의 억울하고 원통한 한을 밝게 굽어살피십시오.","하고 방성대곡 슬피 울 때에, 공중에서 홍련을 부르는 소리에 더욱 비감하여 오른손으로 치마를 휘어 잡고 나는 듯이 물 속으로 뛰어드니, 슬프고도 애달프다.","일광이 무색하고 그 후로는 물 위에 안개 자욱한 속으로 슬피 우는 소리가 주야로 연속하여 계모의 모해로 애매하게 죽은 죽음을 자세히 뇌이니, 이는 원근 사람이 다 알게 하기 위해서였다.","장화 형제의 애원한 한이 구천에 사무쳐 매양 설원코자 하매 아문에 들어가 지원극통한 원정을 아뢰려 하면 철산 부사가 매양 놀라 기절하여 죽어 갔다.","이렇듯이 철산 부사로 오는 사람은 도임한 이튿날이면 죽으므로, 그 후로는 부사로 오는 사람이 없어 철산군은 자연 폐읍이 되었고, 해마다 흉년이 들어 사람이 아사지경에 이르니 백성들이 사방으로 헤어져 한 고을이 텅 비게 되었다.","이러한 사연으로 여러 번 장계를 올리니, 임금이 크게 근심하여 조정에서는 의논이 분분하였다.","하루는 정동호라 하는 사람이 부사로 가기를 자원하였다.","이는 성품이 강직하고 체모가 정중한 사람이라 임금이 들으시고 인견하여 분부를 내리시기를,","철산읍에 이상한 변이 있어 폐읍이 되엇다 하므로 염려하던 중 경이 이제 자원하니 심히 다행하고 아름다우나, 또한 근심이 되니 십분 조심하여 인민을 잘 안돈하라.","하시고 철산 부사를 제수하시나, 부사 사은하고 물러나와 즉시 도임하여 이방을 불러 말하기를,","내 들으니, 네 고을에 관장이 도임한 후면 즉시 죽는다 하니 과연 옳으냐?","이방이 대답하여 여쭈기를,","아뢰옵기 황송하오나 오륙 년 이래로 *등내마다 밤마다 비몽사몽간에 꿈에 깨닫지 못하고 죽으니 그 연고를 알지 못하겠나이다.","하므로 부사는 듣기를 다 하고 분부하기를,","너희들은 밤에 불을 끄고 잠을 자지 말며 고요히 동정을 살피라.","하니, 이방이 청령하고 나아갔다.","이리하여 부사는 객사에 가서 등촉을 밝히고 <주역>을 읽는데, 밤이 깊은 후에 홀연히 찬바람이 일어나며 정신이 아득하여 어찌할 바를 모르는데 난데없는 한 미인이 녹의 홍상으로 완연히 들어와 절하는 것이었다.","부사는 정신을 가다듬어 물어 가로되,","너는 어떠한 여자인데 이 깊은 밤에 와서 무슨 사정을 말하려 하느냐?","그 미인이 고개를 숙이고 몸을 일으켜 다시 절하며 아뢰기를,","소녀는 이 고을에 사는 배좌수의 딸 홍련입니다.","소녀의 형 장화는 칠세 되었고 소녀는 삼 세 되던 해에, 어미를 여의고 아비를 의지하여 세상을 보내더니, 아비가 후처를 얻었나이다.","후처의 성품이 사납고 시기가 극심하던 중 공교히 연하여 삼자를 낳았나이다.","그래서 아비는 혹하여 계모의참소를 신청하고 소녀의 자매를 박대함이 자심하였지만, 소녀의 자매는 그래도 어미라 계모 섬기기를 극진히 하였습니다.","계모의 박대와 시기는 날로 심해졌습니다.","이는 다름아니라 본디 소녀의 어미가 재물이 많아 노비가 수백 인이요, 전답이 천여 석이었습니다.","금은 보화는 거재두량이요, 소녀 자매가 출가하면 재물을 다 가질 생각으로 소녀 자매를 죽여 재물을 빼앗아 제 자식을 주고자 하여, 주야로 모해할 뜻을 두었나이다.","그리하여 몸소 흉계를 내어 큰 쥐를 튀하여 피를 많이 바르고 낙태한 형상을 만들어 형의 이불 밑에 넣고 아비를 속여 죄를 씌운 후에 거짓으로 외삼촌 집으로 보낸다 하고 갑자기 말을 태워 그 아들 장쇠놈으로 하여금 데려다가 못 가운데 넣어 죽게 했습니다.","소녀 이 일을 알고 억울하고 원통하여, 소녀 구차하게 살다가 또 어떤 흉계에 빠질까 두려워 마침내 형이 빠져 죽은 못에 빠져 죽었나이다.죽음은 섧지 않으나 이 불측한 누명을 씻을 길이 없사옵기에 더욱 원통하여 등내마다 원통한 사정을 아뢰고자 하였는데 모두 놀라 죽으므로 뼈에 맺힌 원한을 이루지 못하였나이다.","이제 천행으로 밝으신 사또를 맞아 감히 원통한 원정을 아뢰오니, 사또는 소녀의 슬픈 혼백을 불쌍히 여기시와 천추의 원한을 풀어주시고 형의 누명을 벗겨 주십시오.","말을 맺고 일어나 하직하고 나가기에 부사는 괴이하게 여겨 생각하기를,","당초에 이런 일이 있어 폐읍이 되었도다.","하고 이튿날 아침에 동헌에 나아가 이방을 불러 묻기를,","이 고을에 배좌수라는 사람이 있느냐?","예, 배좌수가 있사옵니다.","좌수 전후처의 자식이 몇이나 있느냐?","두 딸은 일찍 죽사옵고 세 아들이 살아 있나이다.","두 딸은 어찌하여 죽었다 하더냐?","남의 일이오라 자세히는 알지 못하오나, 대강 듣사온즉 그 큰딸이 무슨 죄가 있어 연못에 빠져 죽은 후, 그 동생은 형제의 정이 중하므로 주야로 통곡하다가 필경 형의 죽은 못에 빠져 죽어 한가지로 원혼이 되어 날마다 못가에 나와 앉아 울며 말하기를, '계모의 모해를 입어 누명을 쓰고 죽었노라.'하며 허다한 사연을 하여 행인들이듣고 눈물 아니 흘리는 사람이 없다고 하옵니다.","하는 것이었다.","부사는 듣기를 다 하고 즉시 관차를 보고 분부하기를,","배좌수 부부를 잡아 들여라.","하니, 관차는 영을 듣고 삽시간에 잡아왔다.","부사가 좌수에게 묻기를,","내 들으니 전처의 두 딸과 후처의 세 아들이 있다 하는데 그것이 사실인가.","그러하옵니다.","다 살아 있는가?","두 딸은 병들어 죽었고, 다만 세 아들이 살았습니다.","두 딸이 무슨 병으로 죽었는지 바른 대로 아뢰면 죽기를 면하려니와, 그렇지 않으면 장하에 죽으리라.","좌수 얼굴이 흙빛이 되어 아무 말도 못 하자, 흉녀는 이 말을 듣고 크게 놀라며 아뢰기를,","안전에서 이미 아시옵고 묻사온대 어찌 추호라도 기망함이 있겠나이까.","전실에 두 딸이 있어 장성하더니 장녀 행실이 바르지 못하여 잉태하여 장차 누설케 되었기로 노복들도 모르게 약을 먹여 낙태하였사오나 남은 이러한 줄도 모르고 계모의 모해인 줄 알 듯하기에 저를 불러 경계하기를, '네 죄는 죽어 아깝지 않지만 너를 죽이면 남이 나의 모해로 알겠기에 짐작하여 죄를 사하겠으니, 차후로는 다시 이런한 행실을 말고 마음을 닦아라. 만일 남이 알면 우리집을 경멸할 것이니, 그러면 무슨 면목으로 사람을 대하겠느냐' 하고 꾸증을 하였습니다.","그랬더니 저도 죄를 알고 부모 대하기를 부끄러워하며 스스로 밤에 나가 못에 빠져 죽었습니다.","그 동생 홍련이 또한 제 형의 행실을 본받아 밤에 도주한 지 몇 해가 되었지만, 그 종적을 모를 뿐 아니라, 양반의 자식이 실행하여 나갔다고 해서 어찌 찾을 길이 있겠습니까?","이러므로 나타나지 못하였나이다.","부사가 듣기를 다 하고 물어 말하기를,","네 말이 그러할진대, 낙태한 것을 가져오면 족히 알겠다.","흉녀 대답하여 여쭙기를,","소녀의 골육이 아닌 고로 이런 일을 당할 줄 알고 그 낙태한 것을 깊이 장지하였다 가져왔나이다.","하고 즉시 품속에서 내어드리니 부사는 본즉, 낙태한 것이 분명하므로 이에 분부하기를,","말과 사실이 어긋남 이없으나 죽은 지 오래 되어 분명히 설명할 수 없으니 내 다시 생각하여 처리할 것이니 그냥 물러가 있거라.","그 날 밤에 홍련의 형제가 완연히 부가 앞에 나타나서 절하고 여쭙기를,","소녀들이 천만 의외에 밝으신 사또를 만나서 소녀 자매의 누명을 설원할까 바랐었는데, 사또께서 흉녀의 간특한 꾀에 빠지실 줄 어찌 알았겠나이까.","하며 슬피 울다가 다시 여쭙기를,","일월같이 밝으신 사또는 깊이 통촉하십시오.","옛날에 순임금도 계모의 화를 입었다 하거니와, 소녀의 뼈에 사무친 원한은 삼척동자라도 다 아는 바이거늘, 이제 사또께서 잔악한 계집의 말을 곧이들으시고 깨닫지 못하시니, 어찌 애닯지 않겠나이까.","바라건대 사또께서는 흉녀를 다시 부르셔서 낙태한 것을 올리라 하여 배를 가르고 보시면, 반드시 통촉할 바가 있을 것입니다.","그러니 소녀 자매를 천만 긍측히 여기셔서 법을 밝혀 주시고, 소녀의 아비는 본성이 착하고 어두운 탓으로 흉녀의 간계에 빠져 흑백을 분별치 못하는 것이니 충분히 용서하여 주시기를 바라겠나이다.","말을 마치고 홍련의 자매는 일어나 절하고 청학을 타고 반공에 솟아갔다.","부사는 그 말을 듣고는 분명히 자기가 흉녀에게 속은 것을 깨닫고 더욱 분노하였다.날이 밝기를 기다려 새벽에 좌기를 베풀고 좌수 부부를 성화같이 잡아들여 다른 말은 묻지 앟고 그 낙태한 것을 바삐 들이라 하여 그것을 살펴본즉 낙태가 아닌 줄 분명히 알겠으므로 좌우를 명하여 그 낙태한 것을 배를 가르게 할 때 그 호령이 서리 같았다.","칼을 가져와 배를 갈라 보니, 그 속에 쥐똥이 가득하였다.","허다한 관속들이 이를 보고 모두 흉녀의 간계를 알고 저마다 침을 뱉아 꾸짖으며, 장화 자매의 애매한 죽음을 불쌍히 여겨 눈물을 흘리었다.","부사는 이를 보고 크게 노하여 큰 칼을 씌우고 소리를 높여 호령하여 말하기를,","이 간특한 것아, 네 천고 불측한 죄를 짓고도 방자스럽게 굥교한 말로 속이기로  내가 생각하는 바 있어 방송하였더니, 이제 또한 무슨 말을 꾸며 변명코자 하느냐?","네 국법을 가볍게 여기고 못할 짓을 행하여 무죄한 전실 자식을 죽였으니, 그 사연을 바른 대로 아뢰어라.","좌수는 이 광경을 보고는 애매한 자식의 죽음을 뉘우치며 눈물을 흘리면서 아뢰기를,","소생의 무지한 죄는 성주의 처분에 있사오며 비록 하방의 용렬한 우맹인들 어찌 사리와 체모를 모르겠습니까.","전실 장씨는 가장 현숙하더니 불쌍히 죽고 두 달이 있었는데 부녀가 서로 의지하여 위로하며 세월을 보냈습니다.","그러나 후사를 돌보지 않을 수 없어 후처를 얻어 아들 삼자를 낳아 기꺼워했습니다.","그런데 하루는 소생이 내당에 들어가니 흉녀가 갑자기 변생하여 하는 말이, '영감이 매양 장화를 세상에 없이귀히 여기시더니 제 행실이 불행하여 낙태하였으니 들어가 보라' 하고 이불을 둘추리고 소생이 놀라 어두운 눈에 본즉, 과연 낙태한 것이 확실했습니다.","미련한 소견에 전혀 깨닫지 못하고, 더욱 전처의 유언을 잊고 흉계에 빠져 죽인 것이 틀림없으니 그 죄 만 번 죽어도 사양치 않겠습니다.","말을 마치고 배좌수가 통곡하니 부사가 곡성을 그치게 하고 이에 흉녀를 형틀에 올려 매고 문초를 하니, 흉녀는 매를 이기지 못해 여쭙기를,","소첩의 친정은 대대로 거족이오나 근래에 문중이 쇠잔하여 가세가 탕진하던 차, 좌수가 간청하므로 그 후처가 되었습니다.","전실의 두 딸이 있었는데 그 행동거지가 심히 아름다웠나이다.","그리하여 내 자식같이 양육하여 이십에 이르니 제 행사가 점점 불측하여 백 가지  말에 한 말도 듣지 않고 성실치 못한 일이 많아 원망이 심하였습니다.","하루는 저희 형제의 비밀한 말을 우연히 엿들었습니다.","그 말을 듣고 보니 과연 소첩이 매양 염려하던 바와 같이 불미한 일이므로 마음에 놀랍고 분하지만 , 아비더러 이르면 반드시 모해하는 줄로 알 것이니 부득이 영감을 속이고 쥐를 잡아 피를 묻혀 장화의 이불 밑에 넣고 낙태하였다 하였습니다.","그리고 소첩의 자식 장쇠에게 계교를 가르쳐 장화를 유인하여 연못에 넣어 죽였사온데, 그 아우 홍련이 또한 화를 두려워 밤중에 도주하였사와 법대로 처분을 기다리려니 첩의 아들 장쇠는 이 일로 천벌을 입어 이미 병신이 되었사오니 죄를 사하여 주옵소서.","장쇠 등 삼 형제가 일시에 여쭙기를,","소인 등은 다시 아뢸 말씀이 없사오나 다만 늙은 부모를 대신하여 죽고자 바랄 뿐이옵니다.","하는 것이었다.","부사는 좌수의 처와 장쇠 등의 초사를 듣고 일변 흉녀의 소행을 이해하며, 한편 장화 자매의 원통한 죽음을 불쌍히 여겨 말하기를,","이 죄인은 남과 다르니, 내 임의로 처리 못 하겠다.","감영에 보고하였다.","감사는 이 말을 듣고 크게 놀라 즉시 이 뜻을 조정에 장계하였더니 임금이 보시고 장화 자매를 불쌍히 여기시어 하교하시기를,","흉녀의 죄상은 만만불측하니 능지처참하여 후일을 징계하며, 그 아들 장쇠는 교살할 것이며, 장화 자매의 혼백을 신원하여 비를 세워 표하여 주고, 제 아비는 방송하라.","감사, 하교를 받자 그대로 철산부에 전달하엿다.","부사는 즉시 좌기를 베풀고 흉녀를 능지처참하여 효시하고, 아들 장쇠는 교살하고 좌수는 훈계로 다스렸다.","부사는 몸소 관속을 거느리고 장화 자매가 죽은 못에 나아가 물을 치고 본즉, 두 소저의 시체가 자는 듯이 누워 있는데 얼굴이 조금도 변하지 않아 마치 산 사람과 같았다.","부사는 관곽을 갖추어 명산을 가려 안장하고 무덤 앞에 석자 길이의 비석을 세웠는데 그 비석에 '해동 조선국 평안도 철산군 배무룡의 딸 장화․홍련의 불망비'라 하였다.","부사 장사를 마치고 돌아와 정사를 다스리는데 잠시 곤하여 침석을 의지하여 졸고 있을 즈음 문득 장화 자매가 들어와 절을 하며 아뢰기를,","소녀들은 밝으신 사또를 만나 뼈에 사무친 한을 풀고 또 해골까지 거두어 주시옵고, 아비의 죄를 용서하여 주셨으니 그 은혜는 태산이 낮고 하해가 얕아서 명명지중이라도 결초보은하겠나이다.","미구에 관직이 오를 것이니두고 보옵소서.","이렇게 말하고 간 데가 없거늘 부사 놀라 깨어 보니 침상일몽이었다.","그로부터 차차 승진하여 통제사에 이르니 가히 장화 자매의 음덕이 아닌가.","배좌수는 나라의 처분으로 흉녀를 능지하여 두딸의 원혼을 위로하였으나, 마음에 쾌함이 없고 오직 두 딸의 애매한 죽음을 슬퍼하여 거의 미칠 듯하였다.","할 수만 있으면 다시 이 세상에서 부녀지의를 맺어 남은 한을 풀고자 매양 축원하던 중 집안에 공양할 사람조차없어 마음 둘 곳이 없으므로 부득이 혼처를 구하였다.","그리하여 향속 윤광호의 딸에게 장가드니 나이는 십팔 세요, 용모와 재질이 비상하고 성정이 또한 온순하여 자못 숙녀의 풍도가 있으므로 좌수는 크게 기꺼워 금실이 자별하였다.","하루는 좌수가 외당에서 두 딸의 생각이 간절하여 능히 잠을 이루지 못하고 전전반측할 제 장화자매가 황홀히 단장하고 완연히 들어와 절하며 여쭈기를,","소녀의 팔자가 기구하여 모친을 일찍이 여의고 전생업원으로 모진 계모를 만나 마침내 애매한 누명을 쓰고 부친 슬하를 이별하였으니, 억울하고 원통함을 이기지 못하여 이 원정을 옥황상제께 아뢰었습니다.","상제께서 통촉하시와 이르시기를 '너희 정상이 가긍하나 이 역시 너희 팔자라, 뉘를 원망하리요? 그러나 너의 아비와 세상 인연이 미진하였으니, 다시 세상에 나가 부녀지의를 맺어 서로 원한을 풀어라.'","하시고 물러가라 하셨는데 그 의향을 모르겠나이다.","하였다.","좌수가 그를 붙잡고 반길 때에 닭소리에 놀라 깨어 보니, 무엇을 잃은 듯 여취여광하여 심신을 가누지 못하였다.","후취 윤씨 또한 일몽을 얻으니 선녀가 구름으로 내려와 연꽃 두 송이를 주며 하는 말이,","이는 장화와 홍련이니, 그 애매하게 죽음을 옥황상제께서 불쌍히 여기시어 부인께 점지하니, 귀히 길러 영화를 보라.","하고 간데없기에, 윤씨가 깨어 보니 꽃송이는 손에 쥐어 있고  향기가 방 안에 가득하였다.","윤씨가 크게 괴이하게 여겨 좌수를 청하여 몽사를 전하며,","장화 ․홍련이 어찌 된 사람이니까?","하고 물으니 좌수는 이 말을 듣고 꽃을 본즉 꽃이 넘놀며 반기는 듯하므로 두 딸을 다시 만난 듯해서 눈믈을 흘리고 딸의 전후 사연을 말하여 주었다.","윤씨는 그 달로부터 태기가 있어 십 삭이 되어 갈수록, 배가 너무도 드러나기에 쌍태가 분명하였다.","달이 차매 몸이 피곤하여 침상에 의지하였더니, 이윽고 순산하여 쌍태아 두 딸을 낳았다.","좌수가 밖에 있다가 들어와 부인을 위로하여 산아를 보니, 용모와 기질이 옥으로 새긴 듯 꽃으로 모은 듯, 짝이 없게 아름다워 그 연꽃과 같았다.그들은 이것을 기이하게 여겨 '꽃이 화하여 여아가 되었다'고 하며 이름을 다시 장화․홍련이라 적고 장중보옥같이 길렀다.","세월이 여류하여 사오 세에 이르매, 두 소저의 골격이 비상하고 부모를 효성으로 받들었다.","그들이 점점 성장하여 십오 세에 이르자 덕을 구비하고 재질이 또한 출충하므로 좌수 부부의 사랑함이 비길 데 없었다.","배필을 구하고자 매파를 널리놓았지만, 합당한 곳이 없어 매우 근심하던 중 이 때 평양에 이연호라는 사람이있는데 재산이 누거만 있으나 다만 슬하에 일점 혈육이 없어 슬퍼하다가 늦게야 신령의 현몽으로 쌍태에 아들 형제를 두었다.","이름은 윤필․윤석이라 하는데, 이제 나이 십륙세로 용모가 화려하고 문필이 출중하여 딸 둔 사람들이 모두 탐내며 매파를 보내 청혼하는 것이었다.","그 부모도 또한 자부를 선택하는 데 심상치 않던 차에 배좌수의 딸 쌍둥이 형제가 아주 특이함을 듣고 크게 기꺼워 혼인을 청하였더니, 양가가 서로 합의하여 즉시 허락하고 택일하니 때는 추구월 보름께였다.","이 때 천하가 태평하고 나라에 경사가 있어 과거를 보일새, 윤필의 형제가 참여하여 장원 급제를 하였다.","임금이 그 인재를 기특히 여기시어 즉시 한림 학사를 제수하시니, 한림 형제는 사은하고 말미를 청하니 임금이 허락하시었다.","그리하여 한림 형제가 바로 떠난 집으로 내려오니, 이공이 잔치를 베풀고 친척과 친구들을 청하여 즐기는 것이었다.","본관 수령이 각각 풍악과 포진을 보내고 감사와 서윤이 신래를 기리며 잔을 나누어 치하하니, 가문에 영화는 고금에 드물었다.","이러구러 혼인을 당하여 한림 형제는 위의를 갖추고 풍악을 울리며 혼가에 이르러 예를 마치고 신부를 맞아 돌아와 부모께 현신하였다.","그 아름다운 태도는 가위 한 쌍의 명주요 두 낱의 박옥이라, 부모들은 기꺼움을 측량치 못하였다.","신부 자매가 부모를 효성으로 받들고 군자를 승순하며 장화는 이남 일녀를 낳았다.","그의 장자는 문관으로 공경 재상이 되었고, 차자는 무관으로 장군이 되었다.","홍련도 이남을 두었는데, 장자는 벼슬이 정남에 이르고, 차자는 학행이 높아 산림에 숨어 풍월을 벗삼아 거문고와 서책을 즐겼다.","배좌수는 구십이 되매, 나라에서 특별히 좌찬성을 제수하시었다.","그는 이것으로 여년을 마치고 윤씨 또한 세상을 버리니, 장화 자매가 슬퍼하는 것이었다.","한림 형제도 부모가 돌아가니 형제가 한 집에 동거하여 자손을 거느리고 지냈는데 장화 자매는 칠십삼 세에 한가지로 죽고, 한림 형제는 칠십오 세에 세상을 떠났는데 그 자손이 유자생녀하여 복록을 누렸다고 한다."]);
const PARA_OF={"세종대왕 시절에 평안도 철산군에 한 사람이 있었는데 성은 배씨요, 이름은 무룡이었다.":2,"그는 본디 향반으로 좌수를 지냈을 정도로 성품이 매우 순후하고 가산이 넉넉하여 부러울 것이 없었지만, 다만 슬하에 일점 혈육이 없으므로 부부는 매양 슬퍼하였다.":2,"그러던 어느 날, 부인 장씨가 몸이 곤하여 침상을 의지하고 조는 동안, 문득 한 선관이 하늘에서 내려와 꽃 한 송이를 주기에 부인이 받으려 할 때 홀연 회오리바람이 일며 그 꽃이 변하여 한 선녀가 되어 완연히 부인의 품속으로 들어오는지라.":3,"부인이 놀라 깨어 보니 남가일몽이었다.":3,"부인이 좌수를 향하여 꿈 이야기를 하며 괴이하게 여겼다.":4,"좌수가 이 말을 듣고,":4,"우리의 무자함을 하늘이 불쌍히 여기사 귀자를 점지하심이오.":5,"하며,서로 기뻐하였다.":6,"과연 그 날부터 태기가 있어 십 삭이 차매, 하루는 밤중에 향기가 진동하더니 순산하여 옥녀를 낳았다.":6,"아기의 용모와 기질이 특이하여 좌수 부부는 크게 사랑하며 이름을 장화라 짓고 장중 보옥같이 길렀다.":6,"장화가 두어 살이 되면서 장씨 또다시 태기가 있었다.":7,"좌수 부부는 주야로 아들 낳기를 바랐으나 역시 따를 낳았다.":7,"마음에는 서운하나 할 수 없이 이름을 홍련이라 하였다.":7,"장화 ․홍련 자매가 점점 자라가며 얼굴이 화려하고 기질이 기묘할 뿐더러 효행이 뛰어나니, 좌수 부부는 형제의 자라남을 보고 사랑함이 비길 데 없었다.":7,"그러나 너무 숙성함을 매우 염려하였다.":7,"그러던 가운데 한편 시운이 불행하여 장씨는 홀연히 병을 얻어 자리에 눕게 되었다.":8,"좌수와 장화가 정성을 다하여 주야로 약을 썼지만, 증세가 날로 위중할 뿐이요, 조금도 효험이 없었다.":9,"장화는 초조하여 하늘에 축수하며 모친이 회춘하기를 바랐지만, 이 때 장씨는 자기의 병이 낫지 못하리라 짐작하고, 나어린 두 딸의 손을 잡고 좌수를 청하여 슬퍼하며,":9,"첩이 전생에 죄가 많아 이 세상에 오래 살지 못할 것 같습니다.":10,"죽는 것은 슬프지 않지만, 장화 자매를 기를 사람이 없사오니 지하에 갈지라도 눈을 감지 못할 만큼 슬프니,  이제 골수에 맺힌 한을 가슴에 품고 죽으려 합니다.":10,"외로운 혼백이 바라는 바는 다름이 아니오라 첩이 죽은 후에 다른 여인을 취하실진대 낭군의 마음이 자연 변하기 쉬울 것이니 그것을 두려워합니다.":10,"바라건대 낭군은 첩의 유언을 저 버리지 마시고 지난날의 정의를 생각하시고, 이 두 딸을 불쌍히 여겨 장성한 후에 좋은 가문에 배필을 얻어 봉황의 짝을 지어 주신다면 첩이 비록 어두운 저승 속에서라도 낭군의 은택을 감축하여 결초보은하겠습니다.":10,"하고 길이 탄식한 후, 이내 숨을 거두었다.":11,"장화는 동생을 안고 하늘을 우러러 통곡하니, 그 가련한 정경은 보는 사람으로 하여금 철석 간장이 녹아 내리는 듯하였다.":11,"그럭저럭 장삿날이 다달아 선산에 안장하고 장화는 효심을 다하여 조석으로 상식을 받들며 주야오 과상하엿다.":12,"세월이 여류하여 어느덧 삼상이 지나갔다.":12,"그러나 장화 형제의 망극함은 더욱 새로웠다.":12,"이 때 좌수는 비록 망처의 유언을 생각하였지만 후사를 안 돌아볼 수도 없어서, 이에 혼처를 두루 구하였으나,원하는 여인이 없으므로 부득이 허씨라는 여인에게 장가를 들었다.":13,"허씨의 용모를 말하자면 두 볼은 한 자가 넘고, 눈은 퉁방울 같고,  코는 질병 같고, 입은 메기 같고, 머리털은 돼지털 같고, 키는 장승만 하고, 소리는 이리 소리 같고, 허리는 두 아름이나 되는 것이 게다가 곰배팔이요, 수종다리에 쌍언청이를 겸하였고, 그 주둥이를 썰어 내면 열 사발은 되고, 얽기는 콩멍석 같으니 그 형상은 차마 바고 보기 어려운 데다가 그 심지가 더욱 불량하여 남이 못 할 노릇만을 골라 가며 행하니, 집에 두기가 단 한시인들 난감하였다.":14,"그래도 그것이 계집이라고 그 달부터 태기가 있어 연달아 아들 삼 형재를 낳았다.":15,"좌수는 그로 말미암아 어찌할 바를 모르니 매양 딸과 더불어 죽은 장씨 부인을 생각하며, 잠시라도 두 딸을 못 보면 삼추같이 여기고, 돌아오면 먼저 딸의 침실로 들어가 손을 잡고 눈믈을 흘리며,":15,"너희 자매들이 깊이 규중에 있으면서, 어미 그리워함을 늙은 아비도 매양 슬퍼한다.":16,"하며 가련히 여기는 것이었다.":17,"허씨는 그럴수록 시기하는 마음이 대발하여 장화 ․홍련을 모해하고자 꾀를 생각하였다.":17,"이에 좌수는 허씨의 시기함을 짐작하고 허씨를 불러 크게 꾸짖었다.":17,"우리는 본래 가난하게 지내다가, 전처의 재물이 많아 지금 풍부히 살고 있소.":18,"그대의 먹는 것이 다 전처의 재물이니 그 은혜를 생각하면 크게 감동해야 맏땅한데, 저 어린것들을 심히 괴롭게 하니, 다시는 그러지 마오.":18,"하고, 조용히 타일렀지만 시랑 같은 그 마음이 어찌 뉘우치겠는가.":19,"그 후로는 더욱 불측하여 두 자매를 죽일 뜻을 주야로 생각하였다.":19,"하루는 좌수가 내당으로 들어와 딸의방에 앉으며 두 딸을 살펴보니, 딸 자매가 서로 손을 잡고 슬픔을 머금고 눈물로 옷깃을 적시기에, 좌수가 이것을 보고 매우 측은히 여겨 탄식하며,":20,"이는 반드시 죽은 어미를 생각하고 슬퍼함이로다.":21,"하고, 역시 눈물을 흘렸다.":22,"너희들이 이렇게 장성하였으니, 너희 모친이 살아 있었다면 오죽이나 기쁘겠느냐.":23,"그러나 팔자가 기구하여 허씨 같은 계모를 만나 구박이 자심하니, 너희들의 슬퍼함을 짐작하겠다.":23,"이후에 이런 연고가 또 있으면 내가 처치하여 너희 마음을 편안케 하리라.":23,"하고 나왔다.":24,"이 때 흉녀 허씨가 창 틈으로 이 광경을 엿보고 더욱 분노하여 흉계를 생각하다가 문득 깨닫고, 제 자식 장쇠를 불러 큰 쥐 한 마리를 잡아오게 하였다.그러고는 그것을 껍질을 벗기고 피를 발라, 낙태한 형상을 만들어 장화가 자는 방에 들어가 이불 밑에 넣고 나왔다.":24,"좌수가 들어오기를 기다려 이것을 보이려고 하였는데 마침 좌수가 외당에서 들어왔다.":24,"허씨가 좌수를 보고 정색하며 혀를 차는지라, 괴이하게 여긴 좌수가 그 연고를 물었다.":24,"집안에 불측한 변이 있으나 낭군은 필시 첩의 모해라 하실 듯하기에 처음에는 발설치 못하였습니다.":25,"낭군은 친 어버이라, 나오면 이르고 들어가면 반기는 정을 자식들이 전혀 모르고 부정한 일이 많으나, 내 또한 친 어미가 아니므로 짐작만 하고 있었는데 오늘은 늦도록 기동치 아니하기에 몸이 불편하가 하여 들어가 보니, 과연 낙태를 하고 누웠다가 첩을 보고 미처 수숩치 못하여 쩔쩔매는 것이었습니다.":25,"그래서 첩의 마음에 놀라움이 컸지만, 저와 나만 알고 있거니와 우리는 대대로 양반이라 이런 일이 누설되면 무슨 면목으로 세상을 살아가겠습니까.":25,"좌수는 크게 놀라 이에 부인의 손을 이끌고 여아의 방으로 들어가 이불을 들추어 보았다.":26,"이 때 장화 자매는 잠이 깊이 들어 있었으니,허씨가 그 피묻은 쥐를 가지고 날뛰었다.":26,"용렬한 좌수는 그 흉계를 모르고 놀라며,":26,"이 일을 장차 어찌하리오.":27,"하며 고심하였다.":28,"이 때 흉녀가 하는 말이,":28,"이일이 매우 중난하니 남이 모르게 죽여 흔적을 없이 하면, 남은 이런 줄은 모르고 첩이 심하여 애매한 전실 자식을 모해하여 죽였다고 할 것이요, 남이 알면 부끄러움을 면치 못할 것이니 차라리 첩이 먼저 죽어 모르는게 나을까 합니다.":29,"하고 거짓 자결하는 체하니,  저 미련한 좌수는 그 흉계를 모르고 급히 달려들어 붙들고 빌면서,":30,"그대의 진중한 덕은 내 이미 아는 바이니, 빨리 방법을 가르치면 저 아이를 처치하겠소.":31,"하며 울거늘, 흉녀는 이 말을 듣고,":32,"이제는 원을 이룰 때가 왔다.":33,"하고, 마음에 기꺼워하면서도 겉으론 탄식하여 하는 말이,":34,"내 죽어 모르고자 하였더니, 낭군이 이토록 과념하시니 부득이 참거니와, 저 아이를 죽이지 아니하면 장차 문호에 화를 면치 못할 것입니다.":35,"기세양난이니 빨리 처치하여 이 일이 드러나지 않게 하십시오.":35,"하였다.":205,"좌수는 망처의 유언을 생각하고 망극하나, 일변 분노하여 처치할 묘책을 의논하니, 흉녀는 기뻐하며,":36,"장화를 불러 거짓말로 속여 저희 외삼촌 댁에 다녀오게 하고, 장쇠를 시켜 같이 가다가 뒤 연못에 밀쳐 넣어죽이는 것이 상책일까 합니다.":37,"좌수가 듣고 옳게 여겨 장쇠를 불러 이리이리하라고 계교를 가르쳐 주었다.":38,"이 때 두 소저는 죽은 어머니를 생각하고 슬픔을 금치 못하다가 잠이 깊이 들었으니, 어찌 흉녀의 이런 불측함을 알 수 있었을까?":39,"장화가 잠을 깨어 심신이 울적하므로 괴이하게 여겨 다시 잠을 이루지 못하고 일어나 앉아 있는데, 부친이 부르시기에 깜짝 놀라서 즉시 나아가니 좌수가 말하기를,":39,"너희 와삼촌 집이 여기서 멀지 않으니 잠시 다녀오느라.":40,"장화는 너무나 이외의 영을 들었으므로 일변 놀랍고 일변 슬퍼 눈물을 머금고 말씀드렸다.":41,"소녀 오늘까지 문 밖을 나가 본 일이 없었는데, 부친은 어찌하여 이 깊은 밤에 알지 못하는 길을 가라 하십니까?":42,"좌수가 대노하여 꾸짖으며,":43,"장쇠를 데리고 가라 하였거늘 무슨 잔말을 하여 아비의 영을 거역하느냐.":44,"하므로 장화 이 말을 듣고 방성대곡하여,":45,"부친께서 죽어라 하신들 어찌 분부를 거역하겠습니까마는 밤이 깊었기로 어린 생각에 사정을 아뢸 따름입니다.":46,"분부 이러하시니 황송하지만, 다만 부탁이오니 밤이나 새거든 가게 해 주십시오.":46,"하였더니 좌수 비록 용렬하나, 자식의 정에 끌려 망설이므로 흉녀 이렇듯 수작함을 듣고 갑자기 문을 발길로 박차며 꾸짖어 말하였다.":47,"너는 어버이 영을 순수히 따라야 마땅하거늘, 무슨 말을 하여 부명을 어기느냐.":48,"하고 호령하니 장화는 이에 더욱 서러우나 할 수 없이 울며,":49,"아버님 분부가 이러하시니, 다시 여쭐 말씀이 없습니다.":50,"분부대로 하겠습니다.":50,"하고 침실로 들어가 홍련을 불러 손을 잡고 울면서,":51,"부친의 뜻을 알지 못하거니와 무슨 연고가 있는지 이 밤중에 외가에 다녀오라 하시니 마지못해 가긴 가지만, 이 길이 아무래도 불길하구나.":52,"다만 슬픈 마음은 우리 자매가 모친을 여의고 서로 의지하여 세월을 보내되 한시라도 떠남이 없이 지내더니, 천만 뜻밖에 이 일을 당하여 너를 적적한 빈방에 혼자 두고 갈 일을 생각하면 가슴이 터지고 간장이 타는 내 심사는 청천일장지로다 다 기록치 못할 것이다.":52,"아무쪼록 잘 있거라.":52,"내 가는 길이 좋지 못할 듯하나 되도록 것이니 그 사이 그리움이 있을지라도 참고 기다려라.":52,"옷이나 갈아 입고 가야겠다.":52,"하고, 옷을 갈아 입은 후, 장화는 다시 손을 잡고 울며 아우에게 경계하여,":53,"너는 부친과 계모를 극진히 섬겨 잘못함이 없게 하고 내가 돌아오기글 기다리면, 내 가서 오랫동안 있지 않고 수삼 일에 다녀오겠다.":54,"그 동안 그리워 어찌하여 너를 두고 가는 마음 측량할 길 없으니, 너는 슬퍼 말고 부디 잘 있거라.":54,"말을 마치고 대성통곡하며 손을 붙잡고 서로 헤어지지 못하니,슬프다!":55,"생시에 그지없이 사랑하던 그 모친은 어찌 이런 때를 당하여 저 자매의 형상을 굽어살피지 못하는가.":55,"이 때 흉녀 밖에서 장화의 이렇듯 함을 듣고는 들어와, 시랑 같은 소리를 지르며 말하였다.":56,"네 어찌 이렇게 요란히 구느냐?":57,"하고 장쇠를 불러,":58,"네 누이를 데리고 속히 외가에 다녀오라 하였거늘 그저 있으니 어쩐 일이냐?":59,"그러자, 돼지 같은 장쇠는 바로 염라대왕의 분부나 받은 듯이 소리를 벼락같이 질러 어깨춤을 추며 삼간마루를 떼구르며,":60,"누님은 빨리 나와요.":61,"부명을 거역하여 공연히 나만 꾸지람 듣게 하니 이 아니 원통하오.":61,"하며 재촉이 성화 같으므로 장화는 어쩔 수 없이 홍련의 손을 떨치고 나오려 하였다.":62,"이 때 홍련이 언니의 옷자락을 잡고 울면서,":62,"우리 형제 잠시도 떨어지지 않았었거늘, 갑자기 오늘은 나를 버리고 어디를 가려고 합니까?":63,"하며 쫓아 나오니, 장화는 홍련의 형상를 보며 간장이 마디마디 끊어지는 듯하지만, 홍련을 달래며,":64,"내 잠시 다녀오겠으니 울지 말고 잘 있거라.":65,"하며 설움에 잠겨 말끝을 맺지 못하니, 노복들도 이 광경을 보고 눈물 아니 흘리는 자가 없었다.":66,"홍련이 언니의 치마폭을 잡고 놓지 않거늘, 흉녀가 들이닥쳐 홍련의 손을 뿌리치며,":66,"네 형이 외가에 가는데 네 어찌 이처럼 요망스럽게 구느냐.":67,"하며 꾸짖으므로, 홍련은 맥없이 물러섰다.":68,"흉녀가 장쇠에게 넌지시 눈짓하니 장쇠의 재촉이 성화 같았다.":68,"장화는 마지못해 홍련을 이별하고 부친께 하직하고 말에 올라 통곡하며 가는 것이었다.":68,"장쇠가 말을 급히 몰아 산골짜기로 들어가 한 곳에 다다르니, 산은 첩첩천봉이요 물은 잔잔 백곡인지라, 초목이 무성하고 송백이 자욱하여, 인적이 적막한데 달빛만 휘영청 밝고 구슬픈 두견 소리 일촌간장을 다 끊어 놓는다.":69,"장화가 굽어 보니 송림 가운데 한 못이 있는데 크기가 사십여 리요, 그 깊이는 알지 못할 정도였다.":69,"한 번 보니 정신이 아득하고 물소리만 처량한데, 장쇠 말을 잡고 장화를 내리라 하니 장화는 깜짝 놀라며 큰 소리로 장쇠를 나무랐다.":69,"이 곳에 내리라 함은 어쩐 일이냐?":70,"하니, 장쇠가 대답하길,":71,"누이의 죄를 알 것이니 어찌 물으오?":72,"그대를 외가에 가라 함은 정말이 아니라, 그대 실햄함이 많으되, 계모 착하신 고로 모르는 체하시더니 이미 낙태한 일이 나타났으므로, 나를 시켜 남이 모르게 이 못에 넣고 오라 하기에, 이 곳에 왔으니 속히 물에 들어가오.":72,"하며 잡아 내리는 것이었다.":73,"장화가 이 말을 들으니 청천벽력이 내리는 듯 넋을 읽고 소리를 지르며,":73,"하늘도 야속하오, 이 일이 웬일이요?":74,"무슨 일로 장화를 내시고 또 천고에 없는 누명을 씌워 이 깊은 못에 빠져 죽어 속절없이 원혼이 되게 하시는고?":74,"하늘이여 굽어살피소서.":74,"장화는 세상에 난 후로 문 밖을 모르거늘, 오늘날 애매한 누명을 쓰오니 전생에 죄악이 그렇게 중하던가, 우리 모친은 어찌 세상을 버리시고, 슬픈 인생을 남겼던고,간악한 사람의 모해를 입어 단불에 나비죽듯 죽는 것은 슬프지 않지만, 원통한 이 누명을 어느 시절에 씻으며 외로운 저 동생은 장차 어찌될 것인가?":74,"하며 통곡하니 기절하니, 그 정상은 목석간장이라도 서러워하련마는, 저 불측하고 무정한 장쇠놈은 서서 다만 재촉할 뿐이었다.":75,"이 적막한 산중에 밤이 이미 깊었는데, 아무래도 죽을 인생 발악해야 무엇하나 어서 바삐 물에 들라.":76,"하니 장화 정신을 진정하고,":77,"나의 망극한 정지를 들으라.":78,"너와 나는 비록 이복이나 아비 골육은 한가지라, 전에 우리를 우애하던 정을 생각하여 영영 황천으로 돌아가는 목숨을 가련히 여겨 잠시 말미를 주면, 삼촌 집에도 가고 망모의 묘에 하직이나 하고 외로운 홍련을 부탁하여 위로하고자 하니, 이는 내 목숨을 보존코자 함이 아니라, 변명하면 계모의 시기가 있을 것이요, 살고자 하면 부명을 거역하는 것이니 일정한 명대로 하려니와, 바라건대 잠시 말미를 주면 다녀와 죽음을 청하겠다.":78,"하며 비는 소리, 애원이 처절하나 목석 같은 장쇠 놈은 조금도 측은한 빛이 없이 마침내 듣지 않고 재촉이 성화 같았다.장화는 더욱 망극하여 하늘을 우러러 통곡하며,":79,"명천은 이 억울한 사정을 살피소서.":80,"이 몸 팔자 기박하여, 칠 세에 어미를 여의고 자매 서로 의지하여 서산에 지는 해와 동녘에 돋는 달을 대할 때면 간장이 슬퍼지고, 후원에 피는 꽃과 섬돌에 나는 풀을 볼 적이면 비감하여 눈물이 비오듯 지내왔는데, 십년 후 계모를 얻으니 성품이 불측하여 구박이 자심하온지라 서러운 슬픈 마음을 이기지 못하오나, 밝으면 부친을 따르고 해가 지면 망모를 생각하며 자매 서로 손을 잡고, 기나긴 여름날과 적막한 가을밤을 장우탄탄으로 살아왔었는데 궁흉극악한 계모의 독수를 벗어나지 못하옵고 오늘날 물에 빠져 죽사오니 이 장화의 천만 애매함을 천지․일월․성신ᄋ든 바로잡아 주소서.":80,"홍련의 일생을 어여삐 여기셔서 저 같은 인생을 본받게 하지 마옵소서.":80,"하고 장쇠를 돌아보며,":81,"나는 이미 누명을 쓰고 죽거니와 저 외로운 홍련을 어여삐 여겨 잘 인도하여, 부모에게 호도하고 길이 무량함을 바란다.":82,"하며 왼손으로 치마를 걷어잡고 오른손으로 월귀탄을 벗어 들고 신발을 벗어 못가에 놓고, 발을 구르며 눈물을 비오듯 흘리고 오던 길을 향하여 실성 통곡하며,":83,"불쌍하구나, 홍련아, 적막한 깊은 규중에 너 홀로 남았으니, 가엾은 네 인생이 누구를 의지하고 살아간단 말이냐.":84,"너를 두고 죽는 나는 쓰라린 이 간장이 구비구비 다 녹는다.":84,"말을 마치고 만경창파에 나는 듯이 뛰어드니 참으로 애닯도다.":85,"갑자기 물결이 하늘에 닿으며 찬바람이 일어나고 월광이 무색한데, 산중으로부터 큰 범이 내달아 꾸짖기를,":85,"네 어미 무도하게 애매한 자식을 모해하여 죽이니 어찌 하늘이 무심하겠느냐.":86,"하며 달려들어 장쇠놈의 두 귀와 한 팔, 한 다리를 떼어먹고 온데간데없으니 장쇠 기절하여 땅에 거꾸러지니 장화의 탔던 말이 크게 놀라 집으로 돌아왔다.":87,"흉녀는 장쇠를 보내고 밤이 깊도록 아니 오므로 매우 이상히 여기는데 갑자기 장화가 타고 간 말이 소리를 지르고 달려오기에, 흉녀 생각하기를 장화를 죽이고 온 줄 알고 내다본즉, 말은 온몸에 땀을 흘리고 들어오는데 사람은 없는지라, 흉녀는 크게 놀라 이에 노복을 불러 불을 밝히고 말 오던 자취를 더듬어 찾아가게 하였다.":88,"이윽고 한 곳에 다다라 보니, 장쇠가 거꾸러졌기에 놀라 자세히 살펴보니, 한 팔 , 한 다리와 두 귀가 없고 피를 흘리며 인사불성이라 모두가 놀라 어찌할 바를 몰랐다.":89,"그 때 문득 향내가 진동하며 찬바람이 소슬하므로 괴이하게 여겨 사방을 두루 살펴보니 향내가 못 가운데서 나는 것이었다.":89,"노복이 장쇠를 구하여 오니, 그 어미 놀라 죽시 약을 먹이고 상한 곳을 동여 주니, 장쇠 비로소 정신을 차렸다.":90,"흉녀가 크게 기꺼워하며 그 사연을 물은즉,장쇠는 전후 사연을 다 말하였다.":90,"그 말을 들은 흉녀는 더욱 원망하며 홍련을 마저 죽이려고 주야로 생각하였다.":90,"그러던 중 홍련이 또한 집안일을 전혀 모르다가 집안이 소란함을 보고 괴이하게 여겨 계모에게 그 연고를 물으니,":91,"장쇠는 요괴로운 네 형을 데리고 가다가 길에서 범을 만나 물려서 병이 중하다.":92,"하기에 홍련이 다시 사연을 물은즉, 흉녀는 눈을 흘기며,":93,"네 무슨 요사스런 말을 이토록 하느냐?":94,"하고, 자리를 떨치고 이러나므로, 홍련이 이렇듯 박대함을 보고 가슴이 터지는 듯하며 일신이 떨려, 제 방으로 돌아와 형을 부르며 통곡하다가 홀연 잠이 들었다.":95,"비몽사몽간에 물 속에서 장화가 황룡을 타고 북해로 향하거늘, 홍련이 내달아 물으려 하니 장화는 본 체도 안 하는 것이었다.":96,"홍련이 울며,":97,"형님은 어찌 나를 본 체도 안 하시고 혼자 어디로 가십니까?":98,"하니,그제서야 장화가 눈물을 뿌리며,":99,"이제는 내 몸이 길이 달라서 내 옥황상제께 명을 받아 삼신산으로 약을 캐러 가는데, 길이 바쁘기로 정회를 베풀지 못하지만 너는 나를 무정타고 여기지 말아라.":100,"내 장차 때를 보아 너를 데려가마.":100,"하며 수작할 즈음에 장화가 탄 용이 소리를 지르거늘, 홍련이 깨달으니 침상일몽이었다.":101,"기운이 서늘하고 땀이 나서 정신이 아득한지라, 홍련은 이에 부친께 이 사연을 말씀하며 통곡하여 하는 말이,":102,"오늘을 당하여 소녀의 마음이 무엇을 잃은 듯하여 자연히 슬프오니 형이 이번에 가서 필경 무슨 연고가 있어 사람의 해를 입었나 봅니다.":103,"하고 실성통곡하였다.":104,"좌수가 여아의 말을 들어 보니, 숨통이 막혀 한 마디 말도 못하고 다만 눈물만 흘리는 것이었다.":104,"흉녀가 곁에 있다가 왈칵 성을 내며,":104,"어린아이가 무슨 말을 해서 어른의 마음을 이다지도 슬프게 이렇듯 상심케 하느냐.":105,"하며 등을 밀어 내기에 홍련이 울며 나와 생각하기를,":106,"내 꿈 이야기를 여쭈니 부친은 슬퍼하시며 아무 말도 못 하시고, 계모는 낯빛을 바꾸니 이렇듯 구박하니, 이는 반드시 이 가운데 무슨 연고가 있다.":107,"하며 그 허실을 몰라 애쓰고 있었다.":108,"하루는 흉녀가 나가고 없기에 장쇠를 불러 달래며 언니의 행방을 탐문하였더니, 장쇠는 감히 속이지 못하여 장화의 전후 사연을 거짓없이 말하였다.":109,"그제야 언니가 애매하게 죽은 사실을 알고 깜짝 놀라 기절하였다가 겨우 정신을 차려 형을 부르며,":109,"가련할사 형님이여!":110,"불측할사 흉녀로다!":110,"자상한 우리 형님, 이팔청춘 꽃다운 시절에 망측한 누명 몸에 쓰고 창파에 몸을 던져 천추 원혼되었으니, 뼈에 새긴 이 원한을 어찌하여 풀어 볼까, 참혹하다 우리 형님, 가련한 이 동생을 적막한 공방에 외로이 남겨 두고 어디 가서 안 오시나.":110,"구천에 돌아간들 이 동생이 그리워서 피눈물 지으실 제 구곡간장이 다 녹았을 것이로다.":110,"고금에 이르도록 이런 억울하고 원통한 일이 또 어디있으리요.":110,"하늘이시여 살피시옵소서.":110,"소녀 3세에 어미를 잃고 언니를 의지하여 지내 왔는데, 이 몸의 죄가 많아 모진 목숨이 외로이 남았다가 이런 변을 또 당하니, 언니와 같이 더러운 꼴 보지 말고 차라리 이 내 몸이 일찍 죽어 외로운 혼백이라도 언니를 따라갈까 하나이다.":110,"말을 마치니 눈물은 비오듯 하며 정신이 아득한지라, 아무리 형의 죽은 곳을 찾아가고자 하나 규중 처녀의 몸으로 문 밖 길을 모르니, 어찌 그 곳을 찾으랴?":111,"침식을 전폐하고 밤낮을 한탄할 뿐이었다.":111,"하루는 청조 한 마리가 날아와서 백화가 말발한 사이를 오락가락하기에 홍련이 심중에 헤아리기를,":112,"내 형님의 죽은 곳을 몰라 주야로 궁금하여 한이 되는데 저 청조 비록 미물이나마 저렇듯 왕래하니 필경 나를 데려가려 왔나 보다.":113,"하며 슬픈 정회를 진정치 못하여 좌불안석하였다.":114,"그러다가 문득 보니 청조는 간 곳이 없거늘, 서운한 마음이 비할 데 없었다.":114,"날이 다시 밝으매 홍련이 또 청조가 오기를 기다렸으나 끝내 오지 않아 슬픔을 이기지 못하여 창을 의지하고 생각하기를,":115,"이제는 청조가 오지 않아도 언니 죽은 곳을 찾아가려니와, 이 일을 부친께 말씀하면 못 가게 하실 테니, 이 사연을 기록하여 두고 가야 하겠다.":116,"하고 즉시 지필을 내어 유서를 썼다.":117,"슬프다, 일찍이 모친을 여의고 형제가 서로 의지하여 세월을 보냈더니, 천만 뜻밖에 형이 사람의 불측한 모해를 입어 죄 없이 몹쓸 누명을 쓰고 마침내 원혼이 되니, 어찌 슬프지 않으며 원통하지 않겠습니까? 홍련은 부친 슬하에 이미 십여 년을 모셨다가 오늘날 가련한 형을 쫓아가매, 지금 이 후로는 부친의 용모를 다시 뵙지 못하고 음성조차 들을 길이 없습니다. 이런 일을 생각하면 눈물이 앞을 가려 가슴이 메이는지라 바라건대 부친은 불초 여식을 생각지 마시고 만수 무강하십시오.":118,"이 때는 오경이라 월색이 만정하고 청풍이 소슬하였는데, 문득 청조가 날아와 나무에 앉으며 홍련을 보고 반기는 듯 지저귀는 것이었다.":119,"그것을 보며 홍련이 이르기를,":119,"네 비록 날짐승이나 우리 형님 계신 곳을 가르쳐 주려 왔느냐?":120,"그 청조가 듣고 응하는 듯해서 홍련이 다시 말하기를,":121,"네 만일 나를 가르쳐 주려 왔거든 길을 인도하면 너를 따라가겠다.":122,"하니, 청조는 고개를 조아리며 응하는 듯하기에 홍련이 말하기를,":123,"그러하면 네 잠시 머물러 있어라.":124,"함께 가자.":124,"하고 유서를 벽상에 붙이고 방문을 나오며 일장통곡하여 말하기를,":125,"가련하다, 내 신세여!":126,"이 집을 나가면 언제 다시 이 문전을 보겠는가.":126,"하며 청조를 따라갔다.":127,"몇 리를 못 가서 동방이 밝아오므로 점점 나아가매, 청산은 중중하고 장송은 울울한데 백조는 슬피 울어 사람의 심회를 돋우었다.":128,"청조가 한 못가에서 주저하기에 홍련이 좌우를 살펴보니, 물 위에 오색구름이 자욱한 속에서 슬픈 울음소리가 나며 홍련을 불러 이르는 말이,":129,"너는 무슨 죄로 천금같이 귀중한 목숨을 속절없이 이 곳에다 버리려고 하느냐.":130,"사람이 한 번 죽으면 다시 살지 못하나니, 가련하다 홍련아, 세상일은 헤아리기 힘드니 이런 일일랑 다시 생각지 말고 어서 돌아가 부모님께 효도하고 성현 군자를 만나 아들 딸 고루 낳아 기르며, 돌아가신 어머님 혼령을 위로하여라.":130,"하는 것이었다.":192,"홍련은 이것이 형의 소리임을 알아 듣고 급히 소리질러 말하기를,":131,"형님은 전생에 무슨 죄로 나를 두고 이 곳에 와 외로이 있습니까?":132,"내 형님을 버리고 혼자 살 길이 없으니 한가지로 돌아다니고자 합니다.":132,"하고 또 들으니 공중에서 울음소리가 그치지 아니하고 슬피 울기에, 홍련이 더욱 서러워 정신을 차리지 못하다가 겨우 진정하여 하늘에 절하며 축수하여 비는 말이,":133,"비나이다 비나이다.":134,"빙옥같이 맑은 우리 형님 천추에 몹쓸 누명 설원하여 주십시오.":134,"천지신명은 이 홍련의 억울하고 원통한 한을 밝게 굽어살피십시오.":134,"하고 방성대곡 슬피 울 때에, 공중에서 홍련을 부르는 소리에 더욱 비감하여 오른손으로 치마를 휘어 잡고 나는 듯이 물 속으로 뛰어드니, 슬프고도 애달프다.":135,"일광이 무색하고 그 후로는 물 위에 안개 자욱한 속으로 슬피 우는 소리가 주야로 연속하여 계모의 모해로 애매하게 죽은 죽음을 자세히 뇌이니, 이는 원근 사람이 다 알게 하기 위해서였다.":135,"장화 형제의 애원한 한이 구천에 사무쳐 매양 설원코자 하매 아문에 들어가 지원극통한 원정을 아뢰려 하면 철산 부사가 매양 놀라 기절하여 죽어 갔다.":136,"이렇듯이 철산 부사로 오는 사람은 도임한 이튿날이면 죽으므로, 그 후로는 부사로 오는 사람이 없어 철산군은 자연 폐읍이 되었고, 해마다 흉년이 들어 사람이 아사지경에 이르니 백성들이 사방으로 헤어져 한 고을이 텅 비게 되었다.":137,"이러한 사연으로 여러 번 장계를 올리니, 임금이 크게 근심하여 조정에서는 의논이 분분하였다.":138,"하루는 정동호라 하는 사람이 부사로 가기를 자원하였다.":139,"이는 성품이 강직하고 체모가 정중한 사람이라 임금이 들으시고 인견하여 분부를 내리시기를,":139,"철산읍에 이상한 변이 있어 폐읍이 되엇다 하므로 염려하던 중 경이 이제 자원하니 심히 다행하고 아름다우나, 또한 근심이 되니 십분 조심하여 인민을 잘 안돈하라.":140,"하시고 철산 부사를 제수하시나, 부사 사은하고 물러나와 즉시 도임하여 이방을 불러 말하기를,":141,"내 들으니, 네 고을에 관장이 도임한 후면 즉시 죽는다 하니 과연 옳으냐?":142,"이방이 대답하여 여쭈기를,":143,"아뢰옵기 황송하오나 오륙 년 이래로 *등내마다 밤마다 비몽사몽간에 꿈에 깨닫지 못하고 죽으니 그 연고를 알지 못하겠나이다.":144,"하므로 부사는 듣기를 다 하고 분부하기를,":145,"너희들은 밤에 불을 끄고 잠을 자지 말며 고요히 동정을 살피라.":146,"하니, 이방이 청령하고 나아갔다.":147,"이리하여 부사는 객사에 가서 등촉을 밝히고 <주역>을 읽는데, 밤이 깊은 후에 홀연히 찬바람이 일어나며 정신이 아득하여 어찌할 바를 모르는데 난데없는 한 미인이 녹의 홍상으로 완연히 들어와 절하는 것이었다.":148,"부사는 정신을 가다듬어 물어 가로되,":148,"너는 어떠한 여자인데 이 깊은 밤에 와서 무슨 사정을 말하려 하느냐?":149,"그 미인이 고개를 숙이고 몸을 일으켜 다시 절하며 아뢰기를,":150,"소녀는 이 고을에 사는 배좌수의 딸 홍련입니다.":151,"소녀의 형 장화는 칠세 되었고 소녀는 삼 세 되던 해에, 어미를 여의고 아비를 의지하여 세상을 보내더니, 아비가 후처를 얻었나이다.":151,"후처의 성품이 사납고 시기가 극심하던 중 공교히 연하여 삼자를 낳았나이다.":151,"그래서 아비는 혹하여 계모의참소를 신청하고 소녀의 자매를 박대함이 자심하였지만, 소녀의 자매는 그래도 어미라 계모 섬기기를 극진히 하였습니다.":151,"계모의 박대와 시기는 날로 심해졌습니다.":151,"이는 다름아니라 본디 소녀의 어미가 재물이 많아 노비가 수백 인이요, 전답이 천여 석이었습니다.":152,"금은 보화는 거재두량이요, 소녀 자매가 출가하면 재물을 다 가질 생각으로 소녀 자매를 죽여 재물을 빼앗아 제 자식을 주고자 하여, 주야로 모해할 뜻을 두었나이다.":152,"그리하여 몸소 흉계를 내어 큰 쥐를 튀하여 피를 많이 바르고 낙태한 형상을 만들어 형의 이불 밑에 넣고 아비를 속여 죄를 씌운 후에 거짓으로 외삼촌 집으로 보낸다 하고 갑자기 말을 태워 그 아들 장쇠놈으로 하여금 데려다가 못 가운데 넣어 죽게 했습니다.":152,"소녀 이 일을 알고 억울하고 원통하여, 소녀 구차하게 살다가 또 어떤 흉계에 빠질까 두려워 마침내 형이 빠져 죽은 못에 빠져 죽었나이다.죽음은 섧지 않으나 이 불측한 누명을 씻을 길이 없사옵기에 더욱 원통하여 등내마다 원통한 사정을 아뢰고자 하였는데 모두 놀라 죽으므로 뼈에 맺힌 원한을 이루지 못하였나이다.":153,"이제 천행으로 밝으신 사또를 맞아 감히 원통한 원정을 아뢰오니, 사또는 소녀의 슬픈 혼백을 불쌍히 여기시와 천추의 원한을 풀어주시고 형의 누명을 벗겨 주십시오.":153,"말을 맺고 일어나 하직하고 나가기에 부사는 괴이하게 여겨 생각하기를,":154,"당초에 이런 일이 있어 폐읍이 되었도다.":155,"하고 이튿날 아침에 동헌에 나아가 이방을 불러 묻기를,":156,"이 고을에 배좌수라는 사람이 있느냐?":157,"예, 배좌수가 있사옵니다.":158,"좌수 전후처의 자식이 몇이나 있느냐?":159,"두 딸은 일찍 죽사옵고 세 아들이 살아 있나이다.":160,"두 딸은 어찌하여 죽었다 하더냐?":161,"남의 일이오라 자세히는 알지 못하오나, 대강 듣사온즉 그 큰딸이 무슨 죄가 있어 연못에 빠져 죽은 후, 그 동생은 형제의 정이 중하므로 주야로 통곡하다가 필경 형의 죽은 못에 빠져 죽어 한가지로 원혼이 되어 날마다 못가에 나와 앉아 울며 말하기를, '계모의 모해를 입어 누명을 쓰고 죽었노라.'하며 허다한 사연을 하여 행인들이듣고 눈물 아니 흘리는 사람이 없다고 하옵니다.":162,"부사는 듣기를 다 하고 즉시 관차를 보고 분부하기를,":163,"배좌수 부부를 잡아 들여라.":164,"하니, 관차는 영을 듣고 삽시간에 잡아왔다.":165,"부사가 좌수에게 묻기를,":165,"내 들으니 전처의 두 딸과 후처의 세 아들이 있다 하는데 그것이 사실인가.":166,"그러하옵니다.":167,"다 살아 있는가?":168,"두 딸은 병들어 죽었고, 다만 세 아들이 살았습니다.":169,"두 딸이 무슨 병으로 죽었는지 바른 대로 아뢰면 죽기를 면하려니와, 그렇지 않으면 장하에 죽으리라.":170,"좌수 얼굴이 흙빛이 되어 아무 말도 못 하자, 흉녀는 이 말을 듣고 크게 놀라며 아뢰기를,":171,"안전에서 이미 아시옵고 묻사온대 어찌 추호라도 기망함이 있겠나이까.":172,"전실에 두 딸이 있어 장성하더니 장녀 행실이 바르지 못하여 잉태하여 장차 누설케 되었기로 노복들도 모르게 약을 먹여 낙태하였사오나 남은 이러한 줄도 모르고 계모의 모해인 줄 알 듯하기에 저를 불러 경계하기를, '네 죄는 죽어 아깝지 않지만 너를 죽이면 남이 나의 모해로 알겠기에 짐작하여 죄를 사하겠으니, 차후로는 다시 이런한 행실을 말고 마음을 닦아라. 만일 남이 알면 우리집을 경멸할 것이니, 그러면 무슨 면목으로 사람을 대하겠느냐' 하고 꾸증을 하였습니다.":172,"그랬더니 저도 죄를 알고 부모 대하기를 부끄러워하며 스스로 밤에 나가 못에 빠져 죽었습니다.":172,"그 동생 홍련이 또한 제 형의 행실을 본받아 밤에 도주한 지 몇 해가 되었지만, 그 종적을 모를 뿐 아니라, 양반의 자식이 실행하여 나갔다고 해서 어찌 찾을 길이 있겠습니까?":172,"이러므로 나타나지 못하였나이다.":172,"부사가 듣기를 다 하고 물어 말하기를,":173,"네 말이 그러할진대, 낙태한 것을 가져오면 족히 알겠다.":174,"흉녀 대답하여 여쭙기를,":175,"소녀의 골육이 아닌 고로 이런 일을 당할 줄 알고 그 낙태한 것을 깊이 장지하였다 가져왔나이다.":176,"하고 즉시 품속에서 내어드리니 부사는 본즉, 낙태한 것이 분명하므로 이에 분부하기를,":177,"말과 사실이 어긋남 이없으나 죽은 지 오래 되어 분명히 설명할 수 없으니 내 다시 생각하여 처리할 것이니 그냥 물러가 있거라.":178,"그 날 밤에 홍련의 형제가 완연히 부가 앞에 나타나서 절하고 여쭙기를,":179,"소녀들이 천만 의외에 밝으신 사또를 만나서 소녀 자매의 누명을 설원할까 바랐었는데, 사또께서 흉녀의 간특한 꾀에 빠지실 줄 어찌 알았겠나이까.":180,"하며 슬피 울다가 다시 여쭙기를,":181,"일월같이 밝으신 사또는 깊이 통촉하십시오.":182,"옛날에 순임금도 계모의 화를 입었다 하거니와, 소녀의 뼈에 사무친 원한은 삼척동자라도 다 아는 바이거늘, 이제 사또께서 잔악한 계집의 말을 곧이들으시고 깨닫지 못하시니, 어찌 애닯지 않겠나이까.":182,"바라건대 사또께서는 흉녀를 다시 부르셔서 낙태한 것을 올리라 하여 배를 가르고 보시면, 반드시 통촉할 바가 있을 것입니다.":182,"그러니 소녀 자매를 천만 긍측히 여기셔서 법을 밝혀 주시고, 소녀의 아비는 본성이 착하고 어두운 탓으로 흉녀의 간계에 빠져 흑백을 분별치 못하는 것이니 충분히 용서하여 주시기를 바라겠나이다.":182,"말을 마치고 홍련의 자매는 일어나 절하고 청학을 타고 반공에 솟아갔다.":183,"부사는 그 말을 듣고는 분명히 자기가 흉녀에게 속은 것을 깨닫고 더욱 분노하였다.날이 밝기를 기다려 새벽에 좌기를 베풀고 좌수 부부를 성화같이 잡아들여 다른 말은 묻지 앟고 그 낙태한 것을 바삐 들이라 하여 그것을 살펴본즉 낙태가 아닌 줄 분명히 알겠으므로 좌우를 명하여 그 낙태한 것을 배를 가르게 할 때 그 호령이 서리 같았다.":183,"칼을 가져와 배를 갈라 보니, 그 속에 쥐똥이 가득하였다.":183,"허다한 관속들이 이를 보고 모두 흉녀의 간계를 알고 저마다 침을 뱉아 꾸짖으며, 장화 자매의 애매한 죽음을 불쌍히 여겨 눈물을 흘리었다.":183,"부사는 이를 보고 크게 노하여 큰 칼을 씌우고 소리를 높여 호령하여 말하기를,":184,"이 간특한 것아, 네 천고 불측한 죄를 짓고도 방자스럽게 굥교한 말로 속이기로  내가 생각하는 바 있어 방송하였더니, 이제 또한 무슨 말을 꾸며 변명코자 하느냐?":185,"네 국법을 가볍게 여기고 못할 짓을 행하여 무죄한 전실 자식을 죽였으니, 그 사연을 바른 대로 아뢰어라.":185,"좌수는 이 광경을 보고는 애매한 자식의 죽음을 뉘우치며 눈물을 흘리면서 아뢰기를,":186,"소생의 무지한 죄는 성주의 처분에 있사오며 비록 하방의 용렬한 우맹인들 어찌 사리와 체모를 모르겠습니까.":187,"전실 장씨는 가장 현숙하더니 불쌍히 죽고 두 달이 있었는데 부녀가 서로 의지하여 위로하며 세월을 보냈습니다.":187,"그러나 후사를 돌보지 않을 수 없어 후처를 얻어 아들 삼자를 낳아 기꺼워했습니다.":187,"그런데 하루는 소생이 내당에 들어가니 흉녀가 갑자기 변생하여 하는 말이, '영감이 매양 장화를 세상에 없이귀히 여기시더니 제 행실이 불행하여 낙태하였으니 들어가 보라' 하고 이불을 둘추리고 소생이 놀라 어두운 눈에 본즉, 과연 낙태한 것이 확실했습니다.":187,"미련한 소견에 전혀 깨닫지 못하고, 더욱 전처의 유언을 잊고 흉계에 빠져 죽인 것이 틀림없으니 그 죄 만 번 죽어도 사양치 않겠습니다.":187,"말을 마치고 배좌수가 통곡하니 부사가 곡성을 그치게 하고 이에 흉녀를 형틀에 올려 매고 문초를 하니, 흉녀는 매를 이기지 못해 여쭙기를,":188,"소첩의 친정은 대대로 거족이오나 근래에 문중이 쇠잔하여 가세가 탕진하던 차, 좌수가 간청하므로 그 후처가 되었습니다.":189,"전실의 두 딸이 있었는데 그 행동거지가 심히 아름다웠나이다.":189,"그리하여 내 자식같이 양육하여 이십에 이르니 제 행사가 점점 불측하여 백 가지  말에 한 말도 듣지 않고 성실치 못한 일이 많아 원망이 심하였습니다.":189,"하루는 저희 형제의 비밀한 말을 우연히 엿들었습니다.":189,"그 말을 듣고 보니 과연 소첩이 매양 염려하던 바와 같이 불미한 일이므로 마음에 놀랍고 분하지만 , 아비더러 이르면 반드시 모해하는 줄로 알 것이니 부득이 영감을 속이고 쥐를 잡아 피를 묻혀 장화의 이불 밑에 넣고 낙태하였다 하였습니다.":189,"그리고 소첩의 자식 장쇠에게 계교를 가르쳐 장화를 유인하여 연못에 넣어 죽였사온데, 그 아우 홍련이 또한 화를 두려워 밤중에 도주하였사와 법대로 처분을 기다리려니 첩의 아들 장쇠는 이 일로 천벌을 입어 이미 병신이 되었사오니 죄를 사하여 주옵소서.":189,"장쇠 등 삼 형제가 일시에 여쭙기를,":190,"소인 등은 다시 아뢸 말씀이 없사오나 다만 늙은 부모를 대신하여 죽고자 바랄 뿐이옵니다.":191,"부사는 좌수의 처와 장쇠 등의 초사를 듣고 일변 흉녀의 소행을 이해하며, 한편 장화 자매의 원통한 죽음을 불쌍히 여겨 말하기를,":192,"이 죄인은 남과 다르니, 내 임의로 처리 못 하겠다.":193,"감영에 보고하였다.":194,"감사는 이 말을 듣고 크게 놀라 즉시 이 뜻을 조정에 장계하였더니 임금이 보시고 장화 자매를 불쌍히 여기시어 하교하시기를,":194,"흉녀의 죄상은 만만불측하니 능지처참하여 후일을 징계하며, 그 아들 장쇠는 교살할 것이며, 장화 자매의 혼백을 신원하여 비를 세워 표하여 주고, 제 아비는 방송하라.":195,"감사, 하교를 받자 그대로 철산부에 전달하엿다.":196,"부사는 즉시 좌기를 베풀고 흉녀를 능지처참하여 효시하고, 아들 장쇠는 교살하고 좌수는 훈계로 다스렸다.":196,"부사는 몸소 관속을 거느리고 장화 자매가 죽은 못에 나아가 물을 치고 본즉, 두 소저의 시체가 자는 듯이 누워 있는데 얼굴이 조금도 변하지 않아 마치 산 사람과 같았다.":197,"부사는 관곽을 갖추어 명산을 가려 안장하고 무덤 앞에 석자 길이의 비석을 세웠는데 그 비석에 '해동 조선국 평안도 철산군 배무룡의 딸 장화․홍련의 불망비'라 하였다.":198,"부사 장사를 마치고 돌아와 정사를 다스리는데 잠시 곤하여 침석을 의지하여 졸고 있을 즈음 문득 장화 자매가 들어와 절을 하며 아뢰기를,":199,"소녀들은 밝으신 사또를 만나 뼈에 사무친 한을 풀고 또 해골까지 거두어 주시옵고, 아비의 죄를 용서하여 주셨으니 그 은혜는 태산이 낮고 하해가 얕아서 명명지중이라도 결초보은하겠나이다.":200,"미구에 관직이 오를 것이니두고 보옵소서.":200,"이렇게 말하고 간 데가 없거늘 부사 놀라 깨어 보니 침상일몽이었다.":201,"그로부터 차차 승진하여 통제사에 이르니 가히 장화 자매의 음덕이 아닌가.":201,"배좌수는 나라의 처분으로 흉녀를 능지하여 두딸의 원혼을 위로하였으나, 마음에 쾌함이 없고 오직 두 딸의 애매한 죽음을 슬퍼하여 거의 미칠 듯하였다.":202,"할 수만 있으면 다시 이 세상에서 부녀지의를 맺어 남은 한을 풀고자 매양 축원하던 중 집안에 공양할 사람조차없어 마음 둘 곳이 없으므로 부득이 혼처를 구하였다.":202,"그리하여 향속 윤광호의 딸에게 장가드니 나이는 십팔 세요, 용모와 재질이 비상하고 성정이 또한 온순하여 자못 숙녀의 풍도가 있으므로 좌수는 크게 기꺼워 금실이 자별하였다.":202,"하루는 좌수가 외당에서 두 딸의 생각이 간절하여 능히 잠을 이루지 못하고 전전반측할 제 장화자매가 황홀히 단장하고 완연히 들어와 절하며 여쭈기를,":203,"소녀의 팔자가 기구하여 모친을 일찍이 여의고 전생업원으로 모진 계모를 만나 마침내 애매한 누명을 쓰고 부친 슬하를 이별하였으니, 억울하고 원통함을 이기지 못하여 이 원정을 옥황상제께 아뢰었습니다.":204,"상제께서 통촉하시와 이르시기를 '너희 정상이 가긍하나 이 역시 너희 팔자라, 뉘를 원망하리요? 그러나 너의 아비와 function timing(level,o){

    v.innerHTML=`<div class="sheet sew"><span class="eb">${esc(o.eb||"삯바느질")}</span><h2>${esc(o.title||"저고리 한 벌")}</h2><p class="note">${esc(o.desc||"바늘이 붉은 칸 안에 들어왔을 때 누르세요.")} (Space · E · 화면 누르기) 세 번 맞추면 끝나요.</p>
      <div class="bar"><div class="zone"></div><div class="needle"></div></div><div class="st">○ ○ ○</div></div>`;
    $("#ui").appendChild(v);
    const bar=v.querySelector(".bar"),zone=v.querySelector(".zone"),nd=v.querySelector(".needle"),st=v.querySelector(".st");
    let hits=0,pos=0,dirn=1,alive=true,zl=0,zw=0;const speed=0.32+level*0.08;

    let lt=performance.now();
    const frame=now=>{if(!alive)return;const dt=(now-lt)/1000;lt=now;pos+=dirn*speed*dt;if(pos>1){pos=1;dirn=-1}if(pos<0){pos=0;dirn=1}nd.style.left=`calc(${pos*100}% - 2px)`;requestAnimationFrame(frame)};requestAnimationFrame(frame);
    const press=()=>{if(!alive)return;
      if(pos>=zl&&pos<=zl+zw){hits++;st.textContent="● ".repeat(hits)+"○ ".repeat(3-hits);newZone();
        if(hits>=3){alive=false;setTimeout(()=>{v.remove();UI.modal=false;UI.onKey=null;setBodyTalking(false);res()},350)}}

function orderPuzzle(title,ev){

function makeSong(m){

    while(p<J.n){let len=[1,2,2,3,3][Math.floor(rnd()*5)];if(end&&p>=J.n-4){len=J.n-p}
      if(rnd()<(m.lead==="flute"?0.35:0.18)&&!end){p+=len;continue}
      idx+=[-2,-1,-1,1,1,2,0][Math.floor(rnd()*7)];if(end&&p+len>=J.n)idx=b===bars-1?5:7;idx=Math.max(0,Math.min(10,idx));

    if(h){if(h==="기덕"){gDrum("기",t,0.28);gDrum("덕",t+m.eighth*0.5,0.3)}else gDrum(h,t,h==="덩"||h==="쿵"?0.55:0.32)}

      if(m.lead==="flute")gFlute(f*2,t,dur*1.05,0.16);else if(m.lead==="haegeum")gHaegeum(f*2,t,Math.max(0.18,dur*0.98),0.11);else gPluck(f*2,t,Math.max(0.5,dur*1.4),n.accent?0.34:0.26);

function drawHeld(e,sx,sy,topY,t){

          ctx.strokeStyle="rgba(255,255,255,"+(0.8*(1-q))+")";ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(hx+dx*8,hy+dy*8);ctx.lineTo(hx+dx*(20+reach),hy+dy*(20+reach));ctx.stroke()}

          ctx.strokeStyle="rgba(255,255,255,"+(0.85*(1-q))+")";ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(hx,hy,22,a0-Math.PI/2,ang-Math.PI/2,s<0);ctx.stroke();

const CLUES=["말의 내용","말한 상황과 처지","표정·어조","다른 말과의 관계"];

/* 본문 문장 하나가 정말 본문인지 확인하고 기록첩에 남긴다 */
function bodyLine(who,t){if(!BODY.has(t))throw new Error("심문 판에 본문이 아닌 글: "+String(t).slice(0,30));recAdd(who,t);return t}
function addNote(n){const E=G.ex;const i=E.notes.findIndex(x=>x.id===n.id);n.ch=G.ch;n.p=PARA_OF[n.line]||"";if(i>=0)E.notes[i]=Object.assign(E.notes[i],n);else E.notes.push(n);writeSave();updateHUD()}
const short=t=>t.length>60?t.slice(0,58)+"…":t;

/* ── 심문 판 ──
   cfg={id, who, name, eb, lines:qq(…) 또는 [[누구,글]…], spots:{문장번호(0부터):spot}, intro}
   spot={sum:[보기],sa, intent:[보기],ia, clue:[맞는 단서 번호], why:"부사의 속생각", hintS, hintI,
         trust:{q,opts,hold:"보류 이름",note}  (본문이 아직 답하지 않은 물음. 무엇을 골라도 받아 둔다)
         press:{ok:[카드],think,hint}          (수첩 내밀기. press 만 있는 문장은 내밀기로만 풀린다)} */
function testify(cfg){return new Promise(res=>{
  const lines=cfg.lines.map(x=>Array.isArray(x)?x[1]:x);lines.forEach(t=>bodyLine(cfg.who,t));
  const lite=!!G.ex.lite,spots=cfg.spots||{};
  const needJ=Object.keys(spots).filter(i=>spots[i].intent||spots[i].trust).map(Number),needP=lite?[]:Object.keys(spots).filter(i=>spots[i].press).map(Number);
  const doneJ=new Set(),doneP=new Set();let cur=-1,mode="",step=0,msg="",picks={},wrongs=[];
  UI.modal=true;setBodyTalking(true);sfx("page");
  const v=document.createElement("div");v.className="veil";$("#ui").appendChild(v);
  const total=needJ.length+needP.length,got=()=>doneJ.size+doneP.size;
  const nextHot=()=>{for(const i of needJ)if(!doneJ.has(i))return[i,"j"];for(const i of needP)if(!doneP.has(i))return[i,"p"];return null};
  const optsHTML=(arr,ans,multi)=>`<div class="bopts">${arr.map((o,k)=>`<button data-k="o${k}" data-o="${k}"${(multi?multi.includes(k):k===ans)?' data-hot="1"':""}${wrongs.includes(k)?' class="no" disabled':""}>${k+1}. ${esc(o)}</button>`).join("")}</div>`;
  const paint=()=>{const hot=nextHot(),sp=spots[cur]||{};
    let panel="";
    if(cur>=0&&!mode)panel=`<div class="bact"><button class="btn" data-k="judge"${hot&&hot[0]===cur&&hot[1]==="j"?' data-hot="1"':""}>속뜻 짚기 · 이 말로 무엇을 하려는 걸까?</button>${lite?"":`<button class="btn" data-k="press"${hot&&hot[0]===cur&&hot[1]==="p"?' data-hot="1"':""}>수첩 내밀기 · 이 말은 어긋난다!</button>`}</div>`;
    else if(mode==="judge"){
      if(step===0)panel=`<div class="bstep"><h3>① 겉말 · 이 사람은 겉으로 무슨 말을 했나?</h3>${optsHTML(sp.sum,sp.sa)}</div>`;
      else if(step===1)panel=`<div class="bstep"><h3>② 의도 · 이 말로 무엇을 하려는 걸까?</h3>${optsHTML(sp.intent,sp.ia)}</div>`;
      else if(step===2)panel=`<div class="bstep"><h3>③ 근거 단서 · 무엇을 보고 그렇게 생각했나?</h3>${optsHTML(CLUES,-1,sp.clue)}</div>`;
      else if(step===3)panel=`<div class="bstep"><h3>④ ${esc(sp.trust.q)}</h3><p class="note">아직 본문이 답을 밝히지 않았어요. 지금 내 판단을 고르면 기록지에 남겨 두었다가, 답이 나오는 대목에서 다시 견주어 봐요.</p>${optsHTML(sp.trust.opts,-1,[0])}</div>`}
    else if(mode==="press")panel=`<div class="bstep"><h3>수첩에서 이 말과 어긋나는 카드를 고르세요</h3>${G.ex.cards.length?`<div class="cardg">${G.ex.cards.map(id=>{const c=CARDS[id];const ok=sp.press&&sp.press.ok.includes(id);return `<button data-k="c_${id}" data-c="${id}"${ok?' data-hot="1"':""}${wrongs.includes(id)?' class="no" disabled':""}><b><i>${esc(c.k)}</i>${esc(c.t)}</b>${esc(c.d)}</button>`}).join("")}</div>`:'<p class="note">아직 수첩에 적은 것이 없어요.</p>'}<div class="bact"><button class="btn" data-k="back">그만두기</button></div></div>`;
    v.innerHTML=`<div class="sheet board"><div class="top">${PORT[cfg.who]?`<img src="art/${(G.face&&G.face[cfg.who])||PORT[cfg.who]}.jpg" alt="" onerror="this.remove()">`:""}<div><div class="lab">${esc(cfg.eb||"심문 판")}</div><div class="who">${esc(cfg.name||NAMES[cfg.who]||"")}의 말</div></div><div class="prog">짚을 곳 ${got()} / ${total}</div></div>
      <p class="note">${esc(cfg.intro||"문장을 하나 골라 속뜻을 짚거나, 수첩의 카드를 내밀어 보세요. 짚을 곳을 모두 찾으면 진술이 끝나요.")}</p>
      <ol class="tsl">${lines.map((t,i)=>{const ch=[];if(doneJ.has(i))ch.push(spots[i].trust?'<span class="chip hold">판단 보류</span>':'<span class="chip">속뜻 짚음</span>');if(doneP.has(i))ch.push('<span class="chip">어긋남 찾음</span>');
        return `<li data-k="l${i}" data-l="${i}" class="${i===cur?"on":""}${(doneJ.has(i)||doneP.has(i))?" done":""}"${hot&&hot[0]===i&&cur!==i?' data-hot="1"':""}><span class="n">${i+1}</span><span class="orig" title="수업 자료의 본문">本</span>${esc(t)}${ch.length?"<div>"+ch.join("")+"</div>":""}</li>`}).join("")}</ol>
      ${panel}${msg?`<div class="bmsg ${/^ok|^think/.test(msg)?msg.split(":")[0]:""}">${msg.replace(/^(ok|think):/,"")}</div>`:""}
      ${got()>=total?`<div class="row"><button class="btn pri" data-next>${esc(cfg.done||"진술 끝 ▶")}</button></div>`:""}</div>`};
  const finishJudge=()=>{const sp=spots[cur],t=lines[cur];doneJ.add(cur);sfx("correct");addXp(8);
    const n={id:(cfg.id||"b")+"_"+cur,who:cfg.name||NAMES[cfg.who]||"",line:t,sum:sp.sum[sp.sa],intent:sp.intent?sp.intent[picks.i]:"",intent0:sp.intent&&picks.i0!=null?sp.intent[picks.i0]:"",clue:CLUES[picks.c],res:picks.i0!=null&&picks.i0!==picks.i?"고침":"맞음"};
    if(sp.trust){n.trust=sp.trust.opts[picks.t];n.res="보류";n.hold=sp.trust.hold;G.ex.holds[sp.trust.hold]={id:n.id,pick:picks.t};}
    addNote(n);msg="think:<b>부사의 속생각</b> "+esc(sp.why||"")+(sp.trust?`<br><small>판단 보류로 기록했어요: “${esc(n.trust)}”</small>`:"");mode="";step=0;wrongs=[];picks={}};
  paint();
  v.addEventListener("click",e=>{const sp=spots[cur]||{};
    if(e.target.closest("[data-next]")){v.remove();UI.modal=false;UI.onKey=null;setBodyTalking(false);res();return}
    const li=e.target.closest("[data-l]");if(li&&!mode){cur=+li.dataset.l;msg="";wrongs=[];sfx("click");paint();return}
    const b=e.target.closest("[data-k]");if(!b)return;const k=b.dataset.k;
    if(k==="back"){mode="";wrongs=[];msg="";paint();return}
    if(k==="judge"){if(doneJ.has(cur)){msg="이 문장은 이미 짚었어요.";paint();return}
      if(!sp.intent&&!sp.trust){msg="이 문장에서는 더 짚을 것이 없어 보인다.";sfx("tip");paint();return}
      mode="judge";step=0;msg="";wrongs=[];paint();return}
    if(k==="press"){if(doneP.has(cur)){msg="이 문장의 어긋남은 이미 찾았어요.";paint();return}mode="press";msg="";wrongs=[];paint();return}
    if(b.dataset.c){const id=b.dataset.c;
      if(sp.press&&sp.press.ok.includes(id)){doneP.add(cur);sfx("stamp");sfx("correct");addXp(10);
        addNote({id:(cfg.id||"b")+"_p"+cur,who:cfg.name||NAMES[cfg.who]||"",line:lines[cur],press:CARDS[id].t,res:"어긋남",tries:wrongs.length});
        msg="ok:<b>어긋남을 찾았다!</b> "+esc(sp.press.think||"");mode="";wrongs=[]}
      else{sfx("wrong");miss(cfg.id);wrongs.push(id);msg=sp.press?"이 카드와는 어긋나지 않는 것 같다. <b>실마리</b> "+esc(sp.press.hint||""):"이 문장은 수첩의 카드와 어긋나 보이지 않는다."}
      if(!sp.press){mode=""}paint();return}
    if(b.dataset.o!=null){const o=+b.dataset.o;
      if(step===0){if(o===sp.sa){step=sp.intent?1:3;wrongs=[];msg="";sfx("click")}else{wrongs.push(o);sfx("wrong");msg=esc(sp.hintS||"그 사람이 실제로 한 말을 다시 읽어 보세요.")}paint();return}
      if(step===1){if(picks.i0==null)picks.i0=o;if(o===sp.ia){picks.i=o;step=2;wrongs=[];msg="";sfx("click")}else{wrongs.push(o);sfx("wrong");miss(cfg.id);msg=esc(sp.hintI||"말한 사람의 처지와, 앞뒤의 다른 말을 함께 떠올려 보세요.")}paint();return}
      if(step===2){if(sp.clue.includes(o)){picks.c=o;wrongs=[];if(sp.trust){step=3;msg="";sfx("click")}else finishJudge()}else{wrongs.push(o);sfx("wrong");msg="그 단서로도 짐작할 수는 있지만, 이 문장에서 가장 뚜렷한 단서는 아니에요. 다시 골라 보세요."}paint();return}
      if(step===3){picks.t=o;finishJudge();paint();return}}});
  UI.onKey=e=>{if(got()>=total&&["Enter","Space","KeyE"].includes(e.code)){const b=v.querySelector("[data-next]");if(b)b.click()}return true};
})}

/* 판단 보류 확인: 본문이 답을 밝힌 줄에서, 앞서 고른 판단을 다시 띄우고 그대로 둘지 고칠지 고른다 */
function confirmHold(hold,cfg){const h=G.ex.holds[hold];if(!h)return Promise.resolve();const E=G.ex,n=E.notes.find(x=>x.id===h.id);if(!n)return Promise.resolve();
  return new Promise(res=>{UI.modal=true;setBodyTalking(true);sfx("page");const v=document.createElement("div");v.className="veil";$("#ui").appendChild(v);let step=0;const ok=(cfg.okPick||[]).includes(h.pick);
    const paint=()=>{v.innerHTML=`<div class="sheet board"><span class="eb">판단 보류 확인</span><h2>${esc(cfg.title)}</h2>
      <div class="bmsg"><small>${esc(n.who)}의 말 · 제${n.ch}장</small><br>“${esc(short(n.line))}”<br>그때 내 판단: <b>${esc(n.trust)}</b></div>
      <div class="bmsg ok"><b>본문이 밝힌 것</b> ${esc(cfg.fact)}</div>
      ${step===0?`<div class="bstep"><h3>내 판단을 어떻게 할까?</h3><div class="bopts"><button data-k="keep" data-o="1"${ok?' data-hot="1"':""}>내 판단이 본문과 맞았다 · 그대로 확정한다</button><button data-k="fix" data-o="0"${!ok?' data-hot="1"':""}>내 판단을 고친다(보류를 푼다) · “${esc(cfg.right)}”</button></div></div>`
      :step===1?`<div class="bstep"><h3>왜 고치나? 까닭을 고르세요</h3><div class="bopts">${cfg.why.map((w,k)=>`<button data-k="w${k}" data-w="${k}"${k===0?' data-hot="1"':""}>${esc(w)}</button>`).join("")}</div></div>`
      :`<div class="bmsg think">${esc(cfg.after||"")}</div><div class="row"><button class="btn pri" data-next>계속 ▶</button></div>`}</div>`};
    paint();
    v.addEventListener("click",e=>{if(e.target.closest("[data-next]")){v.remove();UI.modal=false;UI.onKey=null;setBodyTalking(false);res();return}
      const b=e.target.closest("[data-k]");if(!b)return;
      if(step===0){if(b.dataset.k==="keep"){n.res="확인";n.check=cfg.fact;step=2;sfx("correct");addXp(5)}else{step=1;sfx("click")}writeSave();paint();return}
      if(step===1&&b.dataset.w!=null){n.fix={from:n.trust,to:cfg.right,why:cfg.why[+b.dataset.w]};n.res="고침";n.check=cfg.fact;writeSave();step=2;sfx("correct");addXp(8);paint()}});
    UI.onKey=e=>{if(step===2&&["Enter","Space","KeyE"].includes(e.code))v.querySelector("[data-next]").click();return true}})}

/* ── 쓰기: 학생이 한두 문장을 쓴다. 기록지에 남는다 ── */
function writeIt(id,title,q,ph){return new Promise(res=>{UI.modal=true;setBodyTalking(true);sfx("page");const v=document.createElement("div");v.className="veil";$("#ui").appendChild(v);
  const old=G.ex.writes[id]&&G.ex.writes[id].a||(window.DRV?"(자동 점검)":"");
  v.innerHTML=`<div class="sheet wbox"><span class="eb">듣기 기록지 · 쓰기</span><h2>${esc(title)}</h2><p>${esc(q)}</p><textarea placeholder="${esc(ph||"한두 문장으로 써 보세요.")}">${esc(old)}</textarea><div class="bmsg" hidden></div><div class="row"><button class="btn pri" data-go="1">기록지에 남기기 ▶</button></div></div>`;
  const ta=v.querySelector("textarea"),m=v.querySelector(".bmsg");setTimeout(()=>ta.focus(),50);
  v.addEventListener("click",e=>{if(!e.target.closest("[data-go]"))return;const a=ta.value.trim();if(a.length<5){m.hidden=false;m.textContent="조금 더 써 보세요(다섯 글자 이상).";sfx("wrong");return}
    G.ex.writes[id]={t:title,q,a,ch:G.ch};writeSave();sfx("gain");addXp(10);v.remove();UI.modal=false;UI.onKey=null;setBodyTalking(false);res(a)});
  UI.onKey=e=>e.target===ta?false:true})}

/* ── 고르기 판정(심문 판 밖): 맞힐 때까지 다시 고르고, 처음 고른 것을 기록지에 남긴다 ── */
async function judgeAsk(id,who,q,opts,ans,hint,why){let first=null;for(;;){const c=await choose(who,q,opts,{think:1});if(first==null)first=c;if(ans<0||c===ans){sfx("correct");addXp(5);
  addNote({id,who:NAMES[who]||"",line:"",sum:q,intent:opts[c],intent0:opts[first],res:ans<0?"고름":first===ans?"맞음":"고침"});if(why)await BU(why);return c}sfx("wrong");miss(q);await NR(hint)}}

/* ═════════ AI 자유 심문 자리 (설계서 4.8) ═════════
   AI_URL 이 비어 있으면(Worker 연결 전) 학생이 쓴 질문만 기록지에 남긴다. 연결되면 같은 자리에서 인물(AI)이 대답한다.
   AI 의 대답은 언제나 “AI가 꾸민 대답”으로 표시하고 낙관을 찍지 않는다. 판정과 평가는 본문(실제 기록)으로 한다. */
/* Worker 주소: 배포할 때 AI_BASE 에 적는다. 시험할 때는 주소 뒤에 ?ai=http://localhost:8787 처럼 붙여도 된다 */
const AI_BASE="https://cheolsan-interrogation.jihan10.workers.dev";
const AI_URL=(()=>{try{return(new URLSearchParams(location.search).get("ai")||AI_BASE).replace(/\/+$/,"")}catch(e){return AI_BASE}})();
/* 의도 보기: Worker(심문Worker/src/worker.js 의 INTENTS)와 같은 순서여야 한다 */
const AI_INTENTS=["사실을 있는 그대로 알리려고","들은 말임을 밝혀, 확실하지 않다는 것을 드러내려고","의심받기 전에 먼저 막으려고","집안의 체면을 내세워 더 묻지 못하게 하려고","대답을 피하고 말을 돌리려고","책임을 남에게 돌리려고","불쌍하게 보여 동정을 얻으려고","잘못을 뉘우치는 마음을 드러내려고","다른 사람의 죄를 덜어 주려고","일부만 인정하고 나머지는 숨기려고"];
async function aiAsk(slot,who,q,hist){const sid=G.ex.sid||{};const r=await fetch(AI_URL+"/ask",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({slot,who,q,cls:sid.cls,num:sid.num,hist:hist.filter(x=>x.a).map(x=>({q:x.q,a:x.a}))})});
  const d=await r.json().catch(()=>({}));if(!r.ok&&!d.error)throw new Error("ai "+r.status);return d}
function askSlot(cfg){if(G.ex.lite)return Promise.resolve();return new Promise(res=>{UI.modal=true;setBodyTalking(true);sfx("page");
  const v=document.createElement("div");v.className="veil";$("#ui").appendChild(v);
  const A=G.ex.asks[cfg.id]=G.ex.asks[cfg.id]||{t:cfg.title,ch:G.ch,qs:[]};let tab=0,busy=false,err="",crisis="",down=false;
  const left=w=>w.n-A.qs.filter(x=>x.who===w.who).length;
  const needSid=()=>AI_URL&&!down&&!(G.ex.sid&&G.ex.sid.cls&&G.ex.sid.num);
  const pending=()=>A.qs.find(x=>x.a&&x.intent>=0&&x.pick==null);
  const paint=()=>{const w=cfg.whos[tab],mine=A.qs.filter(x=>x.who===w.who),all=cfg.whos.every(x=>left(x)<=0),ai=AI_URL&&!down,pd=pending();
    v.innerHTML=`<div class="sheet board ask"><span class="eb">AI 자유 심문 · ${esc(cfg.title)}</span><h2>${esc(cfg.q||"직접 물어보자")}</h2>
    <p class="note">부사가 되어 인물에게 직접 질문을 써 보세요(100자 이내). 질문 수가 정해져 있으니 무엇을 물을지 골라야 해요.${ai?" 인물의 대답은 AI가 꾸민 말이에요. 본문과 다를 수 있고, 판단은 뒤에 나오는 ‘실제 기록’으로 해요. <b>질문과 대답은 선생님께 보여요.</b>":" <b>지금은 AI가 연결되지 않아 질문만 기록지에 남겨요.</b> 뒤에 나오는 ‘실제 기록’에서 본문의 부사가 무엇을 물었는지 견주어 봐요."}</p>
    ${crisis?`<div class="crisis">${esc(crisis)}<div class="row"><button class="btn" data-ok-crisis>알겠어요</button></div></div>`:""}
    ${needSid()?`<div class="sid"><b>반과 번호를 적어 주세요</b> (이름은 쓰지 않아요) <input data-cls maxlength="6" placeholder="반 예: 1-3" value="${esc((G.ex.sid||{}).cls||"")}"> <input data-num maxlength="3" inputmode="numeric" placeholder="번호" value="${esc((G.ex.sid||{}).num||"")}"> <button class="btn pri" data-sid>확인</button></div>`:`
    <div class="bact">${cfg.whos.map((x,k)=>`<button class="btn${k===tab?" pri":""}" data-tab="${k}">${esc(NAMES[x.who])} · 남은 질문 ${left(x)}</button>`).join("")}</div>

      ${x.a&&x.intent>=0?(x.pick==null?`<div class="pick"><small>이 대답에 숨은 속셈은 무엇일까요? 하나 골라 보세요.</small><div class="bopts">${AI_INTENTS.map((t,k)=>`<button data-pick="${A.qs.indexOf(x)}:${k}"${k===0?" data-k data-hot":""}>${esc(t)}</button>`).join("")}</div></div>`
